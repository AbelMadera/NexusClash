<script>
'use strict';
/* =====================================================================
   CONTENT LOADER — turns the CARDS / LOCATIONS lists at the top of the
   file into game data, and collects friendly messages about mistakes.
   You shouldn't need to edit anything from here down.
   ===================================================================== */
/*ENGINE-START*/
const MAX_TURN = 6, HAND_MAX = 7, DECK_SIZE = 12;
const CONTENT_ERRORS = [];
const EFFECTS = {
  buffAlliesHere:       { on:'reveal',  amount:true, text:n=>`Give your other cards here +${n} Power.` },
  debuffEnemiesHere:    { on:'reveal',  amount:true, text:n=>`Give enemy cards here −${n} Power.` },
  draw:                 { on:'reveal',  amount:true, text:n=>`Draw ${n===1?'a card':n+' cards'}.` },
  energyNext:           { on:'reveal',  amount:true, text:n=>`Get +${n} Energy next turn.` },
  buffHand:             { on:'reveal',  amount:true, text:n=>`Give the cards in your hand +${n} Power.` },
  summon:               { on:'reveal',  needs:'token', text:(n,a)=>`Put a ${DEF[a.token].name} (${DEF[a.token].power} Power) at another location.` },
  addCard:              { on:'reveal',  needs:'card',  text:(n,a)=>`Add a ${DEF[a.card].name} to your hand.` },
  ifAlone:              { on:'reveal',  amount:true, text:n=>`If this is your only card here, +${n} Power.` },
  perAlly:              { on:'reveal',  amount:true, text:n=>`+${n} Power for each other card you have here.` },
  finalTurn:            { on:'reveal',  amount:true, text:n=>`If it's the final turn, +${n} Power.` },
  destroyWeakest:       { on:'reveal',  text:()=>`Destroy the enemy card here with the least Power.` },
  buffRandomAlly:       { on:'reveal',  amount:true, text:n=>`Give another random card of yours +${n} Power.` },
  auraAlliesHere:       { on:'ongoing', amount:true, text:n=>`Your other cards here have +${n} Power.` },
  auraEnemiesHere:      { on:'ongoing', amount:true, text:n=>`Enemy cards here have −${n} Power.` },
  auraAlliesEverywhere: { on:'ongoing', amount:true, text:n=>`Your other cards everywhere have +${n} Power.` },
  locationBonus:        { on:'ongoing', amount:true, text:n=>`+${n} Power at this location.` },
  grow:                 { on:'endTurn', amount:true, text:n=>`This gains +${n} Power.` },
};
const TIMING_LABEL = { reveal:'On Reveal', ongoing:'Ongoing', endTurn:'End of turn' };
const LOC_EFFECTS = {
  none:          { text:()=>'No effect.' },
  playBonus:     { amount:true, text:n=> n>=0 ? `Cards played here get +${n} Power.` : `Cards played here get −${-n} Power.` },
  capacity:      { amount:true, text:n=>`Only ${n} card${n===1?'':'s'} per side fit here.` },
  costReduction: { amount:true, text:n=>`Cards cost ${n} less to play here.` },
  closeAfter:    { amount:true, text:n=>`After turn ${n}, cards can't be played here.` },
  doubleReveal:  { text:()=>'On Reveal abilities here happen twice.' },
  bigBonus:      { amount:true, text:n=>`Cards that cost 5+ have +${n} Power here.` },
  smallOnly:     { amount:true, text:n=>`Only cards that cost ${n} or less can be played here.` },
  recruit:       { text:()=>'Each turn, both players get a Recruit.' },
  drawOnPlay:    { text:()=>'When a card is played here, its owner draws a card.' },
  growHere:      { amount:true, text:n=>`End of turn: cards here get +${n} Power.` },
  energyWinner:  { amount:true, text:n=>`Each turn, whoever is winning here gets +${n} Energy.` },
  underdog:      { amount:true, text:n=>`The side with fewer cards here gets +${n} Power.` },
};
const EFFECT_ALIASES = { lockAfter:'closeAfter' };

function warnContent(msg){ CONTENT_ERRORS.push(msg); }
function hslHex(h){ h=((h%360)+360)%360; const s=.66,l=.52,k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1)); return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join(''); }
function readColor(v, where, fallback){
  if(typeof v==='number') return hslHex(v);
  if(typeof v==='string' && v.trim()){
    const c=v.trim();
    const ok = (typeof CSS!=='undefined' && CSS.supports) ? CSS.supports('color', c) : /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(c);
    if(ok) return c;
    warnContent(`${where}: color "${v}" isn't a color. Use something like "#e8323c".`);
  }
  return fallback;
}
function describe(kind, raw, i){ return `${kind} ${i+1}${raw && typeof raw.name==='string' ? ` (“${raw.name}”)` : raw && raw.id ? ` (${raw.id})` : ''}`; }
function readId(raw, where, seen){
  if(typeof raw.id!=='string' || !raw.id.trim()){ warnContent(`${where}: needs an id, like id:"firehawk". It was skipped.`); return null; }
  const id=raw.id.trim();
  if(!/^[A-Za-z0-9_-]+$/.test(id)){ warnContent(`${where}: id "${id}" can only use letters, numbers, - and _. It was skipped.`); return null; }
  if(seen.has(id)){ warnContent(`${where}: the id "${id}" is used twice. Every id must be different. The second one was skipped.`); return null; }
  seen.add(id); return id;
}
function readInt(v, where, field, min, max, fallback){
  if(typeof v!=='number' || !Number.isFinite(v)){ warnContent(`${where}: ${field} should be a number${min!=null?` from ${min} to ${max}`:''}. Using ${fallback}.`); return fallback; }
  let n=Math.round(v);
  if(min!=null && (n<min || n>max)){ warnContent(`${where}: ${field} ${v} is outside ${min}–${max}. Using ${Math.max(min,Math.min(max,n))}.`); n=Math.max(min,Math.min(max,n)); }
  return n;
}
function readImage(raw, where){
  if(raw.image==null || raw.image==='') return '';
  if(typeof raw.image!=='string'){ warnContent(`${where}: image should be text in quotes. Ignoring it.`); return ''; }
  return raw.image.trim();
}

// Rarity order = the order RARITIES is written in (first = most common).
Object.keys(RARITIES).forEach((k,i)=>{ const r=RARITIES[k]; r.weight=i; r.dupGold = r.duplicateGold ?? r.dupGold ?? 10; r.price = r.price ?? 100; r.label = r.label || k; r.color = r.color || '#b4bdd0'; });

const CARD_DEFS = (()=>{
  const out=[], seen=new Set();
  (Array.isArray(CARDS)?CARDS:[]).forEach((raw,i)=>{
    const where=describe('Card',raw,i);
    if(!raw || typeof raw!=='object'){ warnContent(`${where}: isn't a card. Each card needs { } around it.`); return; }
    const id=readId(raw, where, seen); if(!id) return;
    const d={ id, name: typeof raw.name==='string' && raw.name.trim() ? raw.name.trim() : id,
      cost: readInt(raw.cost, where, 'cost', 0, 6, 1),
      power: readInt(raw.power, where, 'power', -99, 999, 0),
      rarity: raw.rarity, icon: raw.emoji || raw.icon || '❔',
      color: readColor(raw.color ?? raw.hue, where, '#6b6f9e'),
      image: readImage(raw, where), imgPos: typeof raw.imagePos==='string' ? raw.imagePos : '',
      text: typeof raw.text==='string' && raw.text.trim() ? raw.text.trim() : '',
      token: raw.token===true, ability:null, _raw:raw.ability };
    if(!RARITIES[d.rarity]){ warnContent(`${where}: rarity "${raw.rarity}" isn't one of ${Object.keys(RARITIES).map(k=>`"${k}"`).join(', ')}. Using "${Object.keys(RARITIES)[0]}".`); d.rarity=Object.keys(RARITIES)[0]; }
    out.push(d);
  });
  // abilities (second pass, so tokens can be defined anywhere in the list)
  const ids=new Set(out.map(d=>d.id));
  out.forEach((d,i)=>{
    const a=d._raw; delete d._raw;
    if(a==null) return;
    const where=`Card “${d.name}”`;
    if(typeof a!=='object'){ warnContent(`${where}: ability should look like { effect:"draw", amount:1 }. Ignoring it.`); return; }
    const type=a.effect || a.type;
    const E=EFFECTS[type];
    if(!E){ warnContent(`${where}: "${type}" isn't a card effect. See the CARD EFFECTS list at the top of the file.`); return; }
    const ab={ on:E.on, type };
    if(E.amount){ ab.n = (a.amount ?? a.n); if(typeof ab.n!=='number'){ warnContent(`${where}: the ${type} effect needs an amount, like amount:2. Using 1.`); ab.n=1; } }
    if(E.needs){
      const ref=a[E.needs];
      if(!ids.has(ref)){ warnContent(`${where}: ${type} needs ${E.needs}:"id" pointing at a card in the list${ref?` ("${ref}" wasn't found)`:''}. Ignoring the ability.`); return; }
      ab[E.needs]=ref;
    }
    d.ability=ab;
  });
  return out;
})();

const LOCATION_DEFS = (()=>{
  const out=[], seen=new Set();
  (Array.isArray(LOCATIONS)?LOCATIONS:[]).forEach((raw,i)=>{
    const where=describe('Location',raw,i);
    if(!raw || typeof raw!=='object'){ warnContent(`${where}: isn't a location. Each one needs { } around it.`); return; }
    const id=readId(raw, where, seen); if(!id) return;
    let type = raw.effect || raw.type || 'none';
    type = EFFECT_ALIASES[type] || type;
    if(!LOC_EFFECTS[type]){ warnContent(`${where}: "${type}" isn't a location effect. See the LOCATION EFFECTS list. Using "none".`); type='none'; }
    let n = raw.amount ?? raw.n;
    if(LOC_EFFECTS[type].amount && typeof n!=='number'){ warnContent(`${where}: the ${type} effect needs an amount, like amount:2. Using 1.`); n=1; }
    if(type==='capacity') n=Math.max(1,Math.min(4,Math.round(n)));
    const d={ id, name: typeof raw.name==='string' && raw.name.trim() ? raw.name.trim() : id, icon: raw.emoji || raw.icon || '📍',
      color: readColor(raw.color ?? raw.hue, where, '#4a5aa8'), image: readImage(raw, where), imgPos: typeof raw.imagePos==='string'?raw.imagePos:'',
      type, n };
    d.text = typeof raw.text==='string' && raw.text.trim() ? raw.text.trim() : LOC_EFFECTS[type].text(n);
    out.push(d);
  });
  return out;
})();

const DEF = Object.fromEntries(CARD_DEFS.map(d=>[d.id,d]));
const LDEF = Object.fromEntries(LOCATION_DEFS.map(d=>[d.id,d]));
// Barracks-style locations need a Recruit token; make a plain one if it was deleted.
if(LOCATION_DEFS.some(l=>l.type==='recruit') && !DEF.recruit){
  const r={ id:'recruit', name:'Recruit', cost:1, power:2, rarity:Object.keys(RARITIES)[0], icon:'⚔️', color:'#c7812f', image:'', imgPos:'', text:'', token:true, ability:null };
  CARD_DEFS.push(r); DEF.recruit=r;
  warnContent('The "recruit" token is missing but a location uses it, so a basic Recruit was added. Add it back to CARDS to customise it.');
}
const COLLECTIBLE = CARD_DEFS.filter(d=>!d.token);
if(COLLECTIBLE.length<DECK_SIZE) warnContent(`There are only ${COLLECTIBLE.length} collectible cards. A deck needs ${DECK_SIZE} different cards, so add at least ${DECK_SIZE-COLLECTIBLE.length} more to CARDS.`);
if(LOCATION_DEFS.length<3) warnContent(`A match needs at least 3 locations, but only ${LOCATION_DEFS.length} loaded. Add more to LOCATIONS.`);
while(LOCATION_DEFS.length && LOCATION_DEFS.length<3){ const c={...LOCATION_DEFS[0], id:LOCATION_DEFS[0].id+'_'+LOCATION_DEFS.length}; LOCATION_DEFS.push(c); LDEF[c.id]=c; }

// Shop and starter settings
PACKS.forEach((p,i)=>{
  const where=`Pack ${i+1} (“${p.name}”)`;
  p.count = readInt(p.cards ?? p.count, where, 'cards', 1, 10, 3);
  p.color = readColor(p.color ?? p.hue, where, '#2f8fe0');
  if(p.guarantee && !RARITIES[p.guarantee]){ warnContent(`${where}: guarantee "${p.guarantee}" isn't a rarity. Ignoring it.`); p.guarantee=null; }
  p.desc = `${p.count} card${p.count===1?'':'s'}${p.guarantee ? `, 1 ${RARITIES[p.guarantee].label} or better` : ''}`;
});
BUNDLES.forEach(b=>{
  b.icon = b.emoji || b.icon || '🎴';
  b.color = readColor(b.color ?? b.hue, `Bundle “${b.name}”`, '#d9303d');
  const bad=(b.cards||[]).filter(id=>!DEF[id] || DEF[id].token);
  if(bad.length) warnContent(`Bundle “${b.name}”: unknown card id${bad.length>1?'s':''} ${bad.map(x=>`"${x}"`).join(', ')}. ${bad.length>1?'They were':'It was'} removed.`);
  b.cards=(b.cards||[]).filter(id=>DEF[id] && !DEF[id].token);
  if(b.cards.length!==DECK_SIZE) warnContent(`Bundle “${b.name}” has ${b.cards.length} card${b.cards.length===1?'':'s'}, but decks need exactly ${DECK_SIZE}. It won't appear in the shop.`);
});
const VALID_BUNDLES = BUNDLES.filter(b=>b.cards.length===DECK_SIZE);
const STARTER_OWNED = STARTER_CARDS.filter(id=>{ const ok=DEF[id]&&!DEF[id].token; if(!ok) warnContent(`STARTER_CARDS: "${id}" isn't a collectible card id. Skipped.`); return ok; });
const STARTER_LIST = (()=>{
  const deck=STARTER_DECK.filter(id=>{ const ok=DEF[id]&&!DEF[id].token; if(!ok) warnContent(`STARTER_DECK: "${id}" isn't a collectible card id. Skipped.`); return ok; }).slice(0,DECK_SIZE);
  for(const id of [...STARTER_OWNED, ...COLLECTIBLE.map(d=>d.id)]){ if(deck.length>=DECK_SIZE) break; if(!deck.includes(id)) deck.push(id); }
  if(STARTER_DECK.length!==DECK_SIZE) warnContent(`STARTER_DECK has ${STARTER_DECK.length} card${STARTER_DECK.length===1?'':'s'}, but it needs exactly ${DECK_SIZE}. The rest were filled in automatically.`);
  return deck;
})();
const AI_NAMES = OPPONENTS.length ? OPPONENTS : [['Computer','🤖']];
let UID = 1;
const rand = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

function newCard(id, owner){ return { uid:UID++, id, owner, base:DEF[id].power, bonus:0, loc:-1, revealed:false, turn:0 }; }

function newMatch(pDeck, aDeck){
  const locIds = shuffle(LOCATION_DEFS.map(l=>l.id)).slice(0,3);
  const s = { turn:0, stakes:1, pendingMult:1, over:false, result:null,
    locs: locIds.map(id=>({ id, revealed:false, cards:[[],[]] })),
    players: [pDeck, aDeck].map((deck,side)=>({ deck: shuffle(deck.map(id=>newCard(id,side))), hand:[], energy:0, energyNext:0, energyNextFrom:[], energyFrom:[], blitzed:false, staged:[] })) };
  for(let side=0; side<2; side++) for(let i=0;i<3;i++) draw(s, side, null);
  return s;
}
function draw(s, side, ev){
  const p=s.players[side];
  if(!p.deck.length || p.hand.length>=HAND_MAX) return null;
  const c=p.deck.pop(); p.hand.push(c);
  if(ev) ev.push({t:'draw', side, uid:c.uid});
  return c;
}
function addToHand(s, side, id, ev){
  const p=s.players[side];
  if(p.hand.length>=HAND_MAX) return null;
  const c=newCard(id, side); p.hand.push(c);
  if(ev) ev.push({t:'add', side, uid:c.uid});
  return c;
}
const ldef = (s,li) => LDEF[s.locs[li].id];
// A closeAfter location is open up to and including turn n, closed from turn n+1.
function isClosed(s, li){ const d=ldef(s,li); return d.type==='closeAfter' && s.turn>d.n; }
function isLastOpenTurn(s, li){ const d=ldef(s,li); return d.type==='closeAfter' && s.turn===d.n; }
// Rules shared by playing, moving, the AI and summoned tokens.
function entryBlock(s, li, cardId){
  const L=s.locs[li], d=LDEF[L.id];
  if(!L.revealed) return 'Not revealed yet';
  if(isClosed(s,li)) return `Closed after turn ${d.n}`;
  if(d.type==='smallOnly' && DEF[cardId].cost>d.n) return `Cost ${d.n} or less only`;
  return null;
}
function capacity(s, li){ const d=ldef(s,li); return d.type==='capacity' ? d.n : 4; }
function effCost(s, c, li){ let k=DEF[c.id].cost; if(li>=0 && ldef(s,li).type==='costReduction') k-=ldef(s,li).n; return Math.max(0,k); }
function energyLeft(s, side){ const p=s.players[side]; return p.energy - p.staged.reduce((a,st)=>a+st.cost,0); }

function whyCantPlay(s, side, c, li){
  const L=s.locs[li], p=s.players[side];
  const block=entryBlock(s, li, c.id);
  if(block) return block;
  const pending = p.staged.filter(st=>!st.inserted && st.li===li && st.card!==c).length;
  const count = L.cards[side].filter(x=>x!==c).length + pending;
  if(count>=capacity(s,li)) return 'Location full';
  const already = p.staged.find(st=>st.card===c);
  const left = energyLeft(s,side) + (already ? already.cost : 0);
  if(effCost(s,c,li)>left) return 'Not enough energy';
  return null;
}
function stage(s, side, c, li){
  const p=s.players[side];
  let st=p.staged.find(x=>x.card===c);
  if(st){
    if(st.li===li) return;
    if(st.inserted){ const arr=s.locs[st.li].cards[side]; arr.splice(arr.indexOf(c),1); st.inserted=false; }
    st.li=li; st.cost=effCost(s,c,li);
  } else {
    p.hand.splice(p.hand.indexOf(c),1);
    st={ card:c, li, cost:effCost(s,c,li), inserted:false };
    p.staged.push(st);
  }
  c.loc=li;
  if(side===0){ s.locs[li].cards[side].push(c); st.inserted=true; }
}
function unstage(s, side, c){
  const p=s.players[side]; const i=p.staged.findIndex(x=>x.card===c);
  if(i<0) return;
  const st=p.staged[i];
  if(st.inserted){ const arr=s.locs[st.li].cards[side]; arr.splice(arr.indexOf(c),1); }
  p.staged.splice(i,1); c.loc=-1; p.hand.push(c);
}
function commitPlays(s){
  for(let side=0; side<2; side++) for(const st of s.players[side].staged){
    if(!st.inserted){ s.locs[st.li].cards[side].push(st.card); st.inserted=true; }
    st.card.turn=s.turn;
  }
}

function cardPower(s, c){
  let p=c.base+c.bonus;
  if(c.loc<0 || !c.revealed) return p;
  const L=s.locs[c.loc], d=LDEF[L.id];
  for(let side=0; side<2; side++) for(const o of L.cards[side]){
    if(o===c || !o.revealed) continue;
    const a=DEF[o.id].ability; if(!a || a.on!=='ongoing') continue;
    if(a.type==='auraAlliesHere' && side===c.owner) p+=a.n;
    if(a.type==='auraEnemiesHere' && side!==c.owner) p-=a.n;
  }
  for(const L2 of s.locs) for(const o of L2.cards[c.owner]){
    if(o===c || !o.revealed) continue;
    const a=DEF[o.id].ability;
    if(a && a.on==='ongoing' && a.type==='auraAlliesEverywhere') p+=a.n;
  }
  if(d.type==='bigBonus' && DEF[c.id].cost>=5) p+=d.n;
  return p;
}
function locPower(s, li, side){
  const L=s.locs[li]; let t=0, n=0;
  for(const c of L.cards[side]){
    if(!c.revealed) continue;
    t+=cardPower(s,c); n++;
    const a=DEF[c.id].ability;
    if(a && a.on==='ongoing' && a.type==='locationBonus') t+=a.n;
  }
  const d=LDEF[L.id];
  if(d.type==='underdog' && L.revealed){
    const m=L.cards[1-side].filter(c=>c.revealed).length;
    if(n>=1 && n<m) t+=d.n;
  }
  return t;
}
function locWinner(s, li){ const a=locPower(s,li,0), b=locPower(s,li,1); return a>b?0:b>a?1:-1; }
function firstRevealer(s){
  const w=[0,0], tp=[0,0];
  s.locs.forEach((L,li)=>{ const x=locWinner(s,li); if(x>=0) w[x]++; tp[0]+=locPower(s,li,0); tp[1]+=locPower(s,li,1); });
  if(w[0]!==w[1]) return w[0]>w[1]?0:1;
  if(tp[0]!==tp[1]) return tp[0]>tp[1]?0:1;
  return Math.random()<.5?0:1;
}

function bump(c, n, ev){ c.bonus+=n; if(ev) ev.push({t:'pow', uid:c.uid, d:n}); }
function revealCard(s, c, ev){
  c.revealed=true;
  ev.push({t:'reveal', uid:c.uid, side:c.owner});
  const L=s.locs[c.loc], d=LDEF[L.id];
  if(d.type==='playBonus') bump(c, d.n, ev);
  if(d.type==='drawOnPlay') draw(s, c.owner, ev);
  const a=DEF[c.id].ability;
  if(a && a.on==='reveal'){
    const times = d.type==='doubleReveal' ? 2 : 1;
    for(let i=0;i<times;i++) applyReveal(s, c, a, ev);
  }
}
function applyReveal(s, c, a, ev){
  if(c.loc<0) return;
  const L=s.locs[c.loc], me=c.owner, op=1-me;
  switch(a.type){
    case 'buffAlliesHere': L.cards[me].forEach(o=>{ if(o!==c && o.revealed) bump(o,a.n,ev); }); break;
    case 'debuffEnemiesHere': L.cards[op].forEach(o=>{ if(o.revealed) bump(o,-a.n,ev); }); break;
    case 'draw': for(let i=0;i<a.n;i++) draw(s,me,ev); break;
    case 'energyNext': s.players[me].energyNext+=a.n; s.players[me].energyNextFrom.push({label:DEF[c.id].name, n:a.n}); ev.push({t:'text', uid:c.uid, text:'+'+a.n+' Energy next turn'}); break;
    case 'buffHand': s.players[me].hand.forEach(o=>{ o.bonus+=a.n; }); ev.push({t:'hand', side:me, d:a.n}); break;
    case 'summon': {
      const opts=[0,1,2].filter(i=>i!==c.loc && !entryBlock(s,i,a.token) && s.locs[i].cards[me].length<capacity(s,i));
      if(!opts.length) break;
      const li=rand(opts), t=newCard(a.token, me);
      t.loc=li; t.revealed=true; t.turn=s.turn; s.locs[li].cards[me].push(t);
      ev.push({t:'summon', uid:t.uid, from:c.uid});
      break;
    }
    case 'ifAlone': if(L.cards[me].length===1) bump(c,a.n,ev); break;
    case 'perAlly': { const k=L.cards[me].filter(o=>o!==c).length; if(k) bump(c,a.n*k,ev); break; }
    case 'addCard': addToHand(s,me,a.card,ev); break;
    case 'finalTurn': if(s.turn>=MAX_TURN) bump(c,a.n,ev); break;
    case 'destroyWeakest': {
      const en=L.cards[op].filter(o=>o.revealed);
      if(!en.length) break;
      en.sort((x,y)=>cardPower(s,x)-cardPower(s,y));
      const v=en[0];
      L.cards[op].splice(L.cards[op].indexOf(v),1); v.loc=-2;
      ev.push({t:'destroy', uid:v.uid, by:c.uid});
      break;
    }
    case 'buffRandomAlly': {
      const al=[]; s.locs.forEach(l=>l.cards[me].forEach(o=>{ if(o!==c && o.revealed) al.push(o); }));
      if(al.length) bump(rand(al),a.n,ev);
      break;
    }
  }
}
function endOfTurn(s, ev){
  s.locs.forEach(L=>{
    const d=LDEF[L.id];
    for(let side=0; side<2; side++) for(const c of L.cards[side]){
      if(!c.revealed) continue;
      const a=DEF[c.id].ability;
      if(a && a.on==='endTurn' && a.type==='grow') bump(c,a.n,ev);
      if(d.type==='growHere' && L.revealed) bump(c,d.n,ev);
    }
  });
  s.players.forEach(p=>p.staged=[]);
}
function startTurn(s, ev){
  s.turn++;
  if(s.pendingMult>1){ s.stakes*=s.pendingMult; s.pendingMult=1; ev.push({t:'stakes'}); }
  if(s.turn<=3){ s.locs[s.turn-1].revealed=true; ev.push({t:'loc', li:s.turn-1}); }
  // Energy = turn number + bonuses. Every point is recorded in energyFrom so the game can show where it came from.
  s.players.forEach(p=>{ p.energy=s.turn+p.energyNext; p.energyFrom=[{label:`Turn ${s.turn}`, n:s.turn}, ...p.energyNextFrom]; p.energyNext=0; p.energyNextFrom=[]; p.staged=[]; });
  s.locs.forEach((L,li)=>{
    if(!L.revealed) return;
    const d=LDEF[L.id];
    if(d.type==='energyWinner'){ const w=locWinner(s,li); if(w>=0){ s.players[w].energy+=d.n; s.players[w].energyFrom.push({label:d.name, n:d.n}); } }
  });
  for(let side=0; side<2; side++) draw(s, side, ev);
  s.locs.forEach(L=>{ if(L.revealed && LDEF[L.id].type==='recruit') for(let side=0; side<2; side++) addToHand(s, side, 'recruit', ev); });
}
function blitz(s, side){
  const p=s.players[side];
  if(p.blitzed || s.over) return false;
  p.blitzed=true; s.pendingMult*=2; return true;
}
function finishMatch(s){
  s.stakes*=s.pendingMult; s.pendingMult=1; s.stakes*=2;
  const w=[0,0], tp=[0,0], locWinners=[];
  s.locs.forEach((L,li)=>{ const x=locWinner(s,li); locWinners.push(x); if(x>=0) w[x]++; tp[0]+=locPower(s,li,0); tp[1]+=locPower(s,li,1); });
  const winner = w[0]>w[1]?0 : w[1]>w[0]?1 : tp[0]>tp[1]?0 : tp[1]>tp[0]?1 : -1;
  s.over=true;
  s.result={ winner, stakes: winner<0?0:s.stakes, retreat:false, locWinners, tp };
}
function retreat(s, side){
  s.over=true;
  s.result={ winner:1-side, stakes:s.stakes, retreat:true, retreater:side };
}

/* ---------- AI ---------- */
function cloneState(s){
  const cc=c=>({...c});
  return { turn:s.turn, stakes:s.stakes, pendingMult:s.pendingMult, over:false,
    locs:s.locs.map(L=>({ id:L.id, revealed:L.revealed, cards:[L.cards[0].map(cc), L.cards[1].map(cc)] })),
    players:s.players.map(p=>({ energy:p.energy, energyNext:p.energyNext, energyNextFrom:p.energyNextFrom.slice(), energyFrom:p.energyFrom.slice(), blitzed:p.blitzed, staged:[], hand:p.hand.map(cc), deck:p.deck.map(cc) })) };
}
function planValid(s, side, plan){
  const p=s.players[side]; let cost=0; const cnt=[0,0,0];
  for(const {card, li} of plan){
    const L=s.locs[li];
    if(entryBlock(s, li, card.id)) return false;
    cnt[li]++;
    if(L.cards[side].length+cnt[li]>capacity(s,li)) return false;
    cost+=effCost(s,card,li);
  }
  return cost<=p.energy;
}
function simulate(s, side, plan){
  const t=cloneState(s), ev=[], hand=t.players[side].hand;
  const cards=plan.map(({card,li})=>{
    const c=hand.find(x=>x.uid===card.uid);
    hand.splice(hand.indexOf(c),1);
    c.loc=li; c.turn=t.turn; t.locs[li].cards[side].push(c);
    return c;
  });
  cards.forEach(c=>{ if(c.loc>=0) revealCard(t,c,ev); });
  return t;
}
function energySum(from, to){ let x=0; for(let k=from;k<=to;k++) x+=k; return x; }
function aiWinProb(t, side){
  const turn=t.turn;
  const ps=t.locs.map((L,li)=>{
    if(!L.revealed) return 0.5;
    const d=LDEF[L.id], cap=capacity(t,li);
    const lastTurn = d.type==='closeAfter' ? Math.min(MAX_TURN,d.n) : MAX_TURN;
    const oppR = L.cards[1-side].length<cap ? energySum(turn, lastTurn) : 0;
    const myR  = L.cards[side].length<cap ? energySum(turn+1, lastTurn) : 0;
    const diff = locPower(t,li,side) - locPower(t,li,1-side);
    if(oppR===0 && myR===0) return diff>0?1:diff<0?0:0.5;
    const spread = 1.2 + 0.42*(oppR+myR);
    return 1/(1+Math.exp(-1.7*diff/spread));
  });
  const [a,b,c]=ps;
  return a*b + a*c + b*c - 2*a*b*c;
}
function aiPlan(s, side){
  const p=s.players[side], hand=p.hand.slice(), n=hand.length;
  const open=[0,1,2].filter(i=>s.locs[i].revealed);
  const pri=c=>{ const a=DEF[c.id].ability; if(!a) return 1; if(['buffAlliesHere','perAlly','buffRandomAlly'].includes(a.type)) return 3; if(a.type==='debuffEnemiesHere'||a.type==='destroyWeakest') return 2; return 0; };
  const gate = s.locs.some(L=>L.revealed && LDEF[L.id].type==='costReduction');
  const before=[0,1,2].map(li=>locPower(s,li,side));
  let best={ plan:[], score:-Infinity, prob:aiWinProb(s,side) };
  const consider=plan=>{
    const t = plan.length ? simulate(s,side,plan) : s;
    const prob = aiWinProb(t,side);
    const used = plan.reduce((a,x)=>a+effCost(s,x.card,x.li),0);
    let power=0; for(let li=0;li<3;li++) power+=locPower(t,li,side)-before[li];
    const score = prob + (s.turn<MAX_TURN ? 0.035*used/Math.max(1,p.energy) : 0) + 0.002*power + Math.random()*0.008;
    if(score>best.score) best={ plan, score, prob };
  };
  consider([]);
  if(!open.length) return best;
  for(let mask=1; mask<(1<<n); mask++){
    const cards=[]; let minCost=0;
    for(let i=0;i<n;i++) if(mask&(1<<i)){ cards.push(hand[i]); minCost+=Math.max(0, DEF[hand[i].id].cost-(gate?1:0)); }
    if(minCost>p.energy || cards.length>open.length*4) continue;
    cards.sort((a,b)=>pri(a)-pri(b) || DEF[b.id].cost-DEF[a.id].cost);
    const k=cards.length, total=Math.pow(open.length,k), exhaustive=total<=81;
    const tries=exhaustive?total:81;
    for(let x=0;x<tries;x++){
      let code = exhaustive ? x : Math.floor(Math.random()*total);
      const plan=cards.map(c=>{ const li=open[code%open.length]; code=Math.floor(code/open.length); return {card:c, li}; });
      if(planValid(s,side,plan)) consider(plan);
    }
  }
  return best;
}
function aiDecide(s, side, prob){
  const me=s.players[side];
  if(s.turn>=MAX_TURN && prob<0.1) return 'retreat';
  if(s.turn>=4 && s.stakes>=2 && prob<0.18 && Math.random()<0.85) return 'retreat';
  if(s.turn>=5 && s.stakes>=4 && prob<0.3) return 'retreat';
  if(!me.blitzed){
    if(s.turn>=3 && prob>0.72 && Math.random()<0.75) return 'blitz';
    if(s.turn>=5 && prob>0.6) return 'blitz';
    if(s.turn===2 && Math.random()<0.05) return 'blitz';
  }
  return null;
}
function applyAiPlan(s, side, plan){ for(const {card, li} of plan) stage(s, side, card, li); }
/*ENGINE-END*/

const SAVE_KEY='nexus_clash_save_v1';

const TITLE_WORDS = String(SETTINGS.gameTitle || 'Nexus Clash').trim().split(/\s+/);
function defaultSave(){
  const owned={}; [...STARTER_OWNED, ...STARTER_LIST].forEach(id=>owned[id]=1);
  return { gold:SETTINGS.startingGold ?? 500, rank:0, wins:0, losses:0, draws:0, owned, decks:[{name:'Starter Squad', cards:STARTER_LIST.slice()}], active:0,
    featured:{day:'', ids:[]}, lastGift:'', theme:'auto', seenRules:false };
}
function loadSave(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(raw){ const d=JSON.parse(raw); const base=defaultSave(); return Object.assign(base, d); }
  }catch(e){}
  return defaultSave();
}

const $ = (sel, root=document) => root.querySelector(sel);
const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; };
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const vibrate = p => { try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} };
const esc = s => String(s).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const deckReady = d => !!d && d.cards.length===DECK_SIZE;
const ownedCount = () => COLLECTIBLE.filter(d=>SAVE.owned[d.id]>0).length;
const todayKey = () => { const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };

function abilityText(d){
  const a=d.ability;
  const label = a ? `<b>${TIMING_LABEL[a.on]}:</b> ` : '';
  if(d.text) return label + esc(d.text);
  if(!a) return d.token ? 'A token created by other cards.' : 'No ability. Just raw power.';
  return label + esc(EFFECTS[a.type].text(a.n, a));
}
const abilityTag = d => !d.ability ? '✦' : d.ability.on==='reveal' ? '✦' : d.ability.on==='ongoing' ? '∞' : '↻';

const BROKEN_ART=new Set();
// Puts a picture into a card or location. Any size works: it's cropped to fill.
function setArt(img, d){
  img.alt=''; img.draggable=false; img.decoding='async';
  if(d.imgPos) img.style.objectPosition=d.imgPos;
  img.addEventListener('error',()=>{
    img.parentNode && img.parentNode.classList.remove('has-art'); img.remove();
    if(!BROKEN_ART.has(d.id)){ BROKEN_ART.add(d.id); showContentWarnings([`The image for “${d.name}” couldn't load (${d.image.startsWith('data:')?'the pasted image text is damaged':d.image}). Showing its emoji instead.`]); }
  },{once:true});
  img.src=d.image;
}
function buildCardEl(id){
  const d=DEF[id], r=RARITIES[d.rarity];
  const c=el('div','card');
  c.style.setProperty('--c', d.color);
  c.style.setProperty('--rc', r.color);
  const art = d.image && !BROKEN_ART.has(d.id);
  c.innerHTML=`<div class="card-inner"><div class="face front${art?' has-art':''}">${art?'<img class="c-art">':''}<div class="c-icon">${d.icon}</div><div class="c-cost">${d.cost}</div><div class="c-pow"><span>${d.power}</span></div>${d.ability||d.text?`<div class="c-abil">${abilityTag(d)}</div>`:''}<div class="c-name">${esc(d.name)}</div></div><div class="face back"><div class="back-logo">${esc(TITLE_WORDS[0][0]||'N')}</div></div></div>`;
  if(art) setArt(c.querySelector('.c-art'), d);
  return c;
}
let warnBox=null;
function showContentWarnings(list){
  if(!list.length) return;
  if(!warnBox){
    warnBox=el('div','',`<b>Some cards or settings need fixing</b><p>The game still works. Fix these at the top of the file, then refresh.</p><ul></ul><button class="btn sm block">Got it</button>`);
    warnBox.id='content-warn'; warnBox.setAttribute('role','alert');
    warnBox.querySelector('button').onclick=()=>{ warnBox.remove(); warnBox=null; };
    document.body.appendChild(warnBox);
  }
  const ul=warnBox.querySelector('ul');
  list.forEach(m=>{ const li=el('li'); li.textContent=m; ul.appendChild(li); });
}
function setCardPower(e, p, base){
  const s=e.querySelector('.c-pow span');
  if(s.textContent!==String(p)) s.textContent=p;
  e.classList.toggle('up', p>base);
  e.classList.toggle('down', p<base);
}
function refreshBinds(){ document.querySelectorAll('[data-bind="gold"]').forEach(e=>e.textContent=SAVE.gold.toLocaleString()); }
function toast(msg){
  const t=el('div','toast',msg); $('#toasts').appendChild(t);
  setTimeout(()=>t.classList.add('out'),1900); setTimeout(()=>t.remove(),2300);
}
function burst(x, y, colors, n=20, spread=160){
  for(let i=0;i<n;i++){
    const p=el('i','particle');
    const ang=Math.random()*Math.PI*2, dist=spread*(0.4+Math.random()*0.8);
    p.style.left=x+'px'; p.style.top=y+'px';
    p.style.background=colors[i%colors.length];
    p.style.setProperty('--dx', Math.cos(ang)*dist+'px');
    p.style.setProperty('--dy', Math.sin(ang)*dist-40+'px');
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),950);
  }
}
function floatText(target, text, kind){
  if(!target) return;
  const r = target.getBoundingClientRect ? target.getBoundingClientRect() : target;
  const f=el('div','float '+(kind||''),text);
  f.style.left=(r.left+r.width/2)+'px'; f.style.top=(r.top+r.height*0.35)+'px';
  document.body.appendChild(f);
  setTimeout(()=>f.remove(),1050);
}

function closeModal(){ $('#modal').classList.remove('open'); }
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
function confirmModal(title, text, ok='Confirm', danger=true){
  return new Promise(res=>{
    openModal(`<h2>${title}</h2><p>${text}</p><div class="modal-btns"><button class="btn" id="cm-no">Cancel</button><button class="btn ${danger?'primary':'blue'}" id="cm-yes">${ok}</button></div>`, box=>{
      $('#cm-no',box).onclick=()=>{ closeModal(); res(false); };
      $('#cm-yes',box).onclick=()=>{ closeModal(); res(true); };
    });
  });
}
function mountTilt(wrap){
  const c=wrap.querySelector('.card'); if(!c) return;
  wrap.addEventListener('pointermove',e=>{
    const r=c.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
    c.style.transform=`rotateY(${x*24}deg) rotateX(${-y*24}deg)`;
  });
  wrap.addEventListener('pointerleave',()=>c.style.transform='');
}
function cardDetail(id, opts={}){
  const d=DEF[id], r=RARITIES[d.rarity];
  const own=SAVE.owned[id]||0;
  const powerLine = opts.power!=null && opts.power!==d.power ? `<span class="st pow">Now ${opts.power}</span>` : '';
  openModal(`<div class="detail"><div class="detail-card" id="dc"></div><div class="detail-info">
      <div class="rar" style="color:${r.color}">${r.label}${d.token?' token':''}</div>
      <h2>${esc(d.name)}</h2>
      <div class="stats"><span class="st cost">${d.cost} Energy</span><span class="st pow">${d.power} Power</span>${powerLine}</div>
      <p>${abilityText(d)}</p>
      ${!d.token && !opts.inMatch ? `<p style="color:var(--muted);font-size:12px">${own?`You own ${own}`:'Not collected yet. Find it in packs or the shop.'}</p>`:''}
    </div></div>
    ${opts.extra||''}
    <button class="btn block" data-close style="margin-top:10px">Close</button>`, box=>{
      const dc=$('#dc',box); const c=buildCardEl(id);
      if(opts.power!=null) setCardPower(c, opts.power, d.power);
      dc.appendChild(c); mountTilt(dc);
      if(opts.onMount) opts.onMount(box);
    });
}

/* ---------- navigation: Decks · Home · Shop, swipeable ---------- */
const PAGES=['decks','home','shop'];
const pagesEl=$('#pages');
let current='home', pageIdx=1, suppressClickUntil=0;
function placePages(extraPx=0){
  pagesEl.style.transform = extraPx ? `translateX(calc(${-pageIdx*100}% + ${extraPx}px))` : `translateX(${-pageIdx*100}%)`;
}
function show(name){
  const inMatch = name==='match';
  const prev=current; current=name;
  $('#app').classList.toggle('in-match', inMatch);
  $('#scr-match').classList.toggle('active', inMatch);
  $('#tabbar').classList.toggle('hide', inMatch);
  if(!inMatch){
    pageIdx=PAGES.indexOf(name);
    placePages();
    PAGES.forEach((p,i)=>{ $('#scr-'+p).inert = i!==pageIdx; });
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.go===name));
    if(prev!==name) vibrate(6);
  }
  refreshBinds();
  if(!inMatch){ renderHome(); renderDecks(); renderShop(); }
}
document.addEventListener('click',e=>{
  if(performance.now()<suppressClickUntil){ e.stopPropagation(); e.preventDefault(); return; }
},true);
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g) show(g.dataset.go);
});
// swipe: touch + mouse drag
let SW=null;
function swStart(x,y,target){
  if(current==='match' || $('#modal').classList.contains('open') || $('#packov').classList.contains('open')) return;
  if(target.closest('.no-swipe, input, textarea, select')) return;
  SW={ x0:x, y0:y, dx:0, mode:null, t0:performance.now(), w:pagesEl.clientWidth||window.innerWidth };
}
function swMove(x,y,ev){
  if(!SW) return;
  const dx=x-SW.x0, dy=y-SW.y0;
  if(!SW.mode){
    if(Math.abs(dx)<9 && Math.abs(dy)<9) return;
    SW.mode = Math.abs(dx) > Math.abs(dy)*1.15 ? 'h' : 'v';
    if(SW.mode==='h'){ pagesEl.classList.add('dragging'); SW.t0=performance.now(); SW.x0=x; }
    return;
  }
  if(SW.mode!=='h') return;
  if(ev.cancelable) ev.preventDefault();
  let d=x-SW.x0;
  if((pageIdx===0 && d>0) || (pageIdx===PAGES.length-1 && d<0)) d*=0.28;
  SW.dx=d; SW.lastX=x; SW.lastT=performance.now();
  placePages(d);
}
function swEnd(){
  if(!SW) return;
  const s=SW; SW=null;
  if(s.mode!=='h') return;
  pagesEl.classList.remove('dragging');
  if(Math.abs(s.dx)>=12) suppressClickUntil=performance.now()+320;
  const v=s.dx/Math.max(60, performance.now()-s.t0);
  let i=pageIdx;
  if(s.dx < -s.w*0.2 || v < -0.5) i++;
  else if(s.dx > s.w*0.2 || v > 0.5) i--;
  i=Math.max(0,Math.min(PAGES.length-1,i));
  if(i===pageIdx) placePages(); else show(PAGES[i]);
}
pagesEl.addEventListener('touchstart',e=>{ if(e.touches.length===1) swStart(e.touches[0].clientX, e.touches[0].clientY, e.target); else SW=null; },{passive:true});
pagesEl.addEventListener('touchmove',e=>{ if(e.touches.length===1) swMove(e.touches[0].clientX, e.touches[0].clientY, e); },{passive:false});
pagesEl.addEventListener('touchend',swEnd);
pagesEl.addEventListener('touchcancel',swEnd);
pagesEl.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse' && e.button===0) swStart(e.clientX,e.clientY,e.target); });
window.addEventListener('pointermove',e=>{ if(e.pointerType==='mouse' && SW) swMove(e.clientX,e.clientY,e); });
window.addEventListener('pointerup',e=>{ if(e.pointerType==='mouse') swEnd(); });
document.addEventListener('keydown',e=>{
  if(current==='match' || e.target.closest('input,textarea') || $('#modal').classList.contains('open')) return;
  if(e.key==='ArrowLeft' && pageIdx>0) show(PAGES[pageIdx-1]);
  if(e.key==='ArrowRight' && pageIdx<PAGES.length-1) show(PAGES[pageIdx+1]);
});

let lastShowcaseKey='';
const deckTop = (cards, n) => cards.slice().sort((a,b)=>RARITIES[DEF[b].rarity].weight-RARITIES[DEF[a].rarity].weight || DEF[b].cost-DEF[a].cost).slice(0,n);
function renderHome(dir){
  const lvl=Math.floor(SAVE.rank/10)+1, prog=SAVE.rank%10;
  $('#rank-lvl').textContent=lvl;
  requestAnimationFrame(()=>$('#rank-fill').style.width=(prog*10)+'%');
  $('#rank-txt').textContent=`${prog} of 10 cubes to rank ${lvl+1}`;
  $('#wl').innerHTML=`<b>${SAVE.wins}</b> wins<br><b>${SAVE.losses}</b> losses`;
  $('#pb-lvl').textContent=lvl;
  $('#pb-ring').style.setProperty('--p', (prog*10)+'%');
  $('#pb-cubes').textContent=`${prog}/10`;
  const deck=SAVE.decks[SAVE.active];
  const ready=deckReady(deck);
  $('#ds-name').textContent = deck ? deck.name : 'No deck';
  $('#ds-sub').textContent = ready ? 'Tap to switch' : `${deck?deck.cards.length:0}/${DECK_SIZE} cards`;
  $('#pb-deck').classList.toggle('warn', !ready);
  const stack=$('#pb-stack'); stack.innerHTML='';
  deckTop(deck?deck.cards:[],2).reverse().forEach(id=>stack.appendChild(buildCardEl(id)));
  $('#btn-play').classList.toggle('off', !ready);
  $('#play-sub').textContent = ready ? '' : 'Finish your deck';
  const pop=$('#gift-pop');
  $('#gift-sub').textContent=`Tap to claim ${GIFT_GOLD} gold`;
  if(!pop.classList.contains('claim')) pop.hidden = SAVE.lastGift===todayKey();
  const key=(deck?deck.cards.join(','):'')+'|'+SAVE.active;
  const sc=$('#showcase');
  if(key===lastShowcaseKey && !dir && sc.children.length) return;
  lastShowcaseKey=key;
  const ids=deckTop(deck?deck.cards:[],3);
  const fan=el('div','fan');
  if(!ids.length) fan.appendChild(el('div','empty-deck','This deck is empty. Build it on the Decks screen.'));
  const order = ids.length===1 ? [null, ids[0], null] : [ids[1], ids[0], ids[2]];
  order.forEach((id,i)=>{ if(!id) return; const w=el('div','sc sc'+i); const c=buildCardEl(id); c.addEventListener('click',()=>cardDetail(id)); w.appendChild(c); fan.appendChild(w); });
  const old=sc.querySelector('.fan');
  if(!sc.querySelector('.burst-bg')) sc.appendChild(el('div','burst-bg'));
  if(old && dir){
    old.classList.add(dir>0?'out-l':'out-r');
    setTimeout(()=>old.remove(),220);
    fan.classList.add(dir>0?'in-l':'in-r');
    setTimeout(()=>sc.appendChild(fan),200);
  } else { if(old) old.remove(); sc.appendChild(fan); }
}
function cycleDeck(dir){
  const readyIdx=SAVE.decks.map((d,i)=>deckReady(d)?i:-1).filter(i=>i>=0);
  if(!readyIdx.length) return;
  let pos=readyIdx.indexOf(SAVE.active);
  pos = pos<0 ? (dir>0?0:readyIdx.length-1) : (pos+dir+readyIdx.length)%readyIdx.length;
  if(readyIdx[pos]===SAVE.active) return;
  SAVE.active=readyIdx[pos]; editDeck=SAVE.active; persist(); vibrate(8);
  renderHome(dir); renderDecks();
}

function flyCoins(from, toEl, n=8){
  const to=toEl.getBoundingClientRect();
  for(let i=0;i<n;i++){
    const c=el('div','coin','🪙');
    const sx=from.left+from.width*(.2+Math.random()*.6), sy=from.top+from.height*(.2+Math.random()*.6);
    c.style.transform=`translate(${sx}px,${sy}px)`;
    document.body.appendChild(c);
    c.getBoundingClientRect();
    c.style.transitionDelay=(i*45)+'ms';
    c.style.transform=`translate(${to.left+to.width*.25}px,${to.top+to.height*.2}px) scale(.6)`;
    c.style.opacity='.2';
    setTimeout(()=>c.remove(), 700+i*45);
  }
}

let editDeck=SAVE.active, costFilter='all', rarityFilter='all', showLocked=false, sortMode=0;
const SORTS=[
  {label:'Cost',   fn:(a,b)=>DEF[a].cost-DEF[b].cost || DEF[a].power-DEF[b].power || DEF[a].name.localeCompare(DEF[b].name)},
  {label:'Power',  fn:(a,b)=>DEF[b].power-DEF[a].power || DEF[a].cost-DEF[b].cost || DEF[a].name.localeCompare(DEF[b].name)},
  {label:'Name',   fn:(a,b)=>DEF[a].name.localeCompare(DEF[b].name)},
  {label:'Rarity', fn:(a,b)=>RARITIES[DEF[b].rarity].weight-RARITIES[DEF[a].rarity].weight || DEF[a].cost-DEF[b].cost},
];
function renderDecks(){
  if(editDeck>=SAVE.decks.length) editDeck=0;
  const deck=SAVE.decks[editDeck];
  $('#dk-name').textContent=deck.name;
  const useBtn=$('#deck-use');
  const inUse=editDeck===SAVE.active;
  useBtn.textContent = inUse ? 'In use' : 'Use deck';
  useBtn.disabled = inUse;
  $('#sort-lbl').textContent=SORTS[sortMode].label;
  $('#filter-dot').classList.toggle('on', costFilter!=='all' || rarityFilter!=='all' || showLocked);
  renderDeckGrid();
  renderCollection();
}
function sortedIds(ids){ return ids.slice().sort(SORTS[0].fn); }
function renderDeckGrid(newId){
  const deck=SAVE.decks[editDeck];
  const g=$('#deck-grid'); g.innerHTML='';
  const ids=sortedIds(deck.cards);
  for(let i=0;i<DECK_SIZE;i++){
    const slot=el('div','dslot');
    const id=ids[i];
    if(id){
      const c=buildCardEl(id); c.classList.add('compact');
      if(id===newId) c.classList.add('pop-in');
      c.onclick=()=>toggleInDeck(id);
      c.setAttribute('aria-label',`Remove ${DEF[id].name} from deck`);
      slot.appendChild(c);
    }
    g.appendChild(slot);
  }
  const counts=[1,2,3,4,5,6].map(k=>deck.cards.filter(id=>Math.max(1,Math.min(6,DEF[id].cost))===k).length);
  const mx=Math.max(3,...counts);
  $('#curve').innerHTML=counts.map((n,i)=>`<div><i style="height:${Math.max(2,n/mx*14)}px"></i>${i===0?'≤1':i===5?'6+':i+1}</div>`).join('');
  const avg=deck.cards.length ? deck.cards.reduce((a,id)=>a+DEF[id].cost,0)/deck.cards.length : 0;
  $('#avg').innerHTML=`avg <b>${avg.toFixed(1)}</b>`;
  const cnt=$('#deck-count'); cnt.textContent=`${deck.cards.length}/${DECK_SIZE}`; cnt.classList.toggle('full', deck.cards.length===DECK_SIZE);
}
function renderCollection(){
  const deck=SAVE.decks[editDeck];
  const grid=$('#coll-grid'); grid.innerHTML='';
  const list=COLLECTIBLE.map(d=>d.id).sort(SORTS[sortMode].fn)
    .filter(id=>(showLocked || SAVE.owned[id]>0) && (costFilter==='all' || DEF[id].cost===costFilter) && (rarityFilter==='all' || DEF[id].rarity===rarityFilter));
  $('#coll-sub').textContent=`${ownedCount()} of ${COLLECTIBLE.length} owned`;
  if(!list.length){ grid.innerHTML=`<div class="empty" style="grid-column:1/-1">No cards match. Change the filter, or open packs in the shop.</div>`; return; }
  list.forEach(id=>{
    const owned=SAVE.owned[id]>0;
    const w=el('div','cc'+(deck.cards.includes(id)?' indeck':'')+(owned?'':' locked'));
    w.appendChild(buildCardEl(id));
    w.insertAdjacentHTML('beforeend',`<div class="chk">✓</div><div class="lock">🔒</div>${owned&&SAVE.owned[id]>1?`<div class="own">×${SAVE.owned[id]}</div>`:''}<button class="info" aria-label="Card details">i</button>`);
    w.addEventListener('click',e=>{
      if(e.target.closest('.info') || !owned) return cardDetail(id);
      toggleInDeck(id, w);
    });
    grid.appendChild(w);
  });
}
function toggleInDeck(id, wrap){
  const deck=SAVE.decks[editDeck];
  const i=deck.cards.indexOf(id);
  if(i>=0){ deck.cards.splice(i,1); vibrate(8); }
  else{
    if(deck.cards.length>=DECK_SIZE) return toast('Deck is full. Tap a card in the deck to remove it.');
    deck.cards.push(id); vibrate(12);
  }
  persist(); lastShowcaseKey='';
  renderDeckGrid(i<0?id:null);
  if(wrap) wrap.classList.toggle('indeck', i<0);
  else renderCollection();
  renderHome();
}

function autoFill(){
  const deck=SAVE.decks[editDeck];
  const value=id=>{ const d=DEF[id]; return d.power/Math.max(1,d.cost) + RARITIES[d.rarity].weight*0.6 + (d.ability?0.5:0) + Math.random()*0.3; };
  const pool=COLLECTIBLE.map(d=>d.id).filter(id=>SAVE.owned[id]>0 && !deck.cards.includes(id)).sort((a,b)=>value(b)-value(a));
  const target={1:2,2:3,3:2,4:2,5:2,6:1};
  const bucket=id=>Math.max(1,Math.min(6,DEF[id].cost));
  for(const k of [1,2,3,4,5,6]){
    for(const id of pool.slice()){
      if(deck.cards.length>=DECK_SIZE || deck.cards.filter(x=>bucket(x)===k).length>=target[k]) break;
      if(bucket(id)===k){ deck.cards.push(id); pool.splice(pool.indexOf(id),1); }
    }
  }
  while(deck.cards.length<DECK_SIZE && pool.length) deck.cards.push(pool.shift());
  persist(); lastShowcaseKey=''; renderDecks(); renderHome();
  if(deck.cards.length<DECK_SIZE) toast('Not enough cards yet. Visit the shop for more.');
}

function seeded(seed){ let t=seed>>>0; return ()=>{ t+=0x6D2B79F5; let r=Math.imul(t^t>>>15,1|t); r^=r+Math.imul(r^r>>>7,61|r); return ((r^r>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(const ch of s){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function rollFeatured(rng){
  const pick=(rar, used)=>{ const opts=COLLECTIBLE.filter(d=>d.rarity===rar && !used.includes(d.id)); return opts.length ? opts[Math.floor(rng()*opts.length)].id : null; };
  const ids=[];
  ['common','rare','epic', rng()<0.35?'legendary':'rare'].forEach(r=>{ const id=pick(r,ids); if(id) ids.push(id); });
  return ids;
}
function ensureFeatured(){
  if(SAVE.featured.day!==todayKey()){ SAVE.featured={ day:todayKey(), ids:rollFeatured(seeded(hashStr(todayKey()))) }; persist(); }
}
function rollRarity(odds){
  const total=Object.values(odds).reduce((a,b)=>a+b,0);
  let x=Math.random()*total;
  for(const [k,v] of Object.entries(odds)){ if((x-=v)<0) return k; }
  return 'common';
}
// If a rarity has no cards (e.g. you deleted all legendaries), use the closest rarity that has some.
function poolFor(rar){
  const w=RARITIES[rar].weight, keys=Object.keys(RARITIES);
  for(let dist=0; dist<keys.length; dist++){
    for(const k of keys){ if(Math.abs(RARITIES[k].weight-w)!==dist) continue; const p=COLLECTIBLE.filter(d=>d.rarity===k); if(p.length) return p; }
  }
  return COLLECTIBLE;
}
function rollPack(pack){
  const ids=[];
  for(let i=0;i<pack.count;i++){
    let rar=rollRarity(pack.odds);
    if(i===pack.count-1 && pack.guarantee && !ids.some(id=>RARITIES[DEF[id].rarity].weight>=RARITIES[pack.guarantee].weight) && RARITIES[rar].weight<RARITIES[pack.guarantee].weight) rar=pack.guarantee;
    ids.push(rand(poolFor(rar)).id);
  }
  return ids.sort((a,b)=>RARITIES[DEF[a].rarity].weight-RARITIES[DEF[b].rarity].weight);
}
function buildPackEl(pack){
  const p=el('div','pack',`<div class="crimp t"></div><div class="p-logo">${esc(TITLE_WORDS[0])}</div><div class="p-name">${esc(pack.name)}</div><div class="p-count">${pack.count} CARD${pack.count===1?'':'S'}</div><div class="crimp b"></div>`);
  p.style.setProperty('--c',pack.color);
  return p;
}

async function buyPack(pk){

let M=null;

function pickAiDeck(){
  const presets=[{name:'Starter Squad', cards:STARTER_LIST}, ...VALID_BUNDLES.map(b=>({name:b.name, cards:b.cards}))];
  if(Math.random()<0.3 || presets.length<2){
    const pool=shuffle(COLLECTIBLE.map(d=>d.id));
    const cards=[]; const target={1:2,2:3,3:2,4:2,5:2,6:1};
    const bucket=id=>Math.max(1,Math.min(6,DEF[id].cost));
    for(const k of [1,2,3,4,5,6]){ for(const id of pool){ if(cards.filter(x=>bucket(x)===k).length>=target[k]) break; if(bucket(id)===k && !cards.includes(id)) cards.push(id); } }
    for(const id of pool){ if(cards.length>=DECK_SIZE) break; if(!cards.includes(id)) cards.push(id); }
    while(cards.length<DECK_SIZE && pool.length) cards.push(rand(pool));   // tiny card lists: allow repeats
    return {name:'Wildcard', cards};
  }
  return rand(presets);
}

async function startMatch(){
  const deck=SAVE.decks[SAVE.active];
  if(!deck || deck.cards.length!==DECK_SIZE){ toast('Your deck needs 12 cards before you can play'); editDeck=SAVE.active; show('decks'); return; }

  M={ s, els:new Map(), busy:true, cols:null, aiName, first:0, deckName:deck.name };

  $('#vs-ai').textContent=aiName; $('#vs-aiav').textContent=aiIcon; $('#vs-aideck').textContent=ai.name; $('#vs-deck').textContent=deck.name;
  $('#result').classList.remove('open');
  show('match');
  buildBoard();
  const vs=$('#vs'); vs.classList.add('open');
  await sleep(1500);
  vs.classList.remove('open');
  await sleep(200);
  mRender({ stagger:true });
  await sleep(500);
  if(!SAVE.seenDragHint){ SAVE.seenDragHint=true; persist(); toast('Drag a card onto your side of a location'); }
  await startTurnUI();
}

function buildBoard(){

function getEl(c){
  let e=M.els.get(c.uid);
  if(!e){
    e=buildCardEl(c.id);
    e.dataset.uid=c.uid;
    if(c.owner===1 && !c.revealed) e.classList.add('facedown');
    M.els.set(c.uid, e);
    e._isNew=true;
    if(c.owner===0) attachDrag(e, c);
    else e.addEventListener('click',()=>{ if(c.revealed && c.loc>=0) cardDetail(c.id,{inMatch:true, power:cardPower(M.s,c)}); });
  }
  return e;
}

function flip(e, first, delay=0){
  e.style.transition='none'; e.style.transform='';
  const last=e.getBoundingClientRect();
  if(!last.width || !first) return;
  const dx=first.left-last.left, dy=first.top-last.top, sx=first.width/last.width, sy=first.height/last.height;
  if(Math.abs(dx)<.5 && Math.abs(dy)<.5 && Math.abs(sx-1)<.01) return;
  e.style.transform=`translate(${dx}px,${dy}px) scale(${sx},${sy})`;
  e.getBoundingClientRect();
  e.style.transition=`transform .45s cubic-bezier(.2,.9,.25,1) ${delay}ms`;
  e.style.transform='';
}

function setLocPow(node, v){
  if(node.textContent!==String(v)){
    node.textContent=v;
    node.classList.remove('bump'); void node.offsetWidth; node.classList.add('bump');
  }
}

function mRender(opts={}){
  if(!M) return;
  const s=M.s;
  const before=new Map();
  for(const [uid,e] of M.els) if(e.isConnected) before.set(uid, e.getBoundingClientRect());
  if(opts.first) for(const [uid,r] of opts.first) before.set(uid, r);
  const seen=new Set();

  s.locs.forEach((L,li)=>{
    const col=M.cols[li], d=LDEF[L.id];
    col.loc.classList.toggle('hidden', !L.revealed);
    col.loc.classList.toggle('locked', L.revealed && isClosed(s,li) && !s.over);
    col.loc.classList.toggle('closing', L.revealed && isLastOpenTurn(s,li) && !s.over);
    const p0=locPower(s,li,0), p1=locPower(s,li,1);
    const n0=col.loc.querySelector('.p0'), n1=col.loc.querySelector('.p1');
    setLocPow(n0,p0); setLocPow(n1,p1);
    n0.classList.toggle('win', p0>p1); n1.classList.toggle('win', p1>p0);
    for(let side=0; side<2; side++){
      L.cards[side].forEach((c,k)=>{
        const e=getEl(c); seen.add(c.uid);
        const slot=col.slots[side][k];
        if(slot && e.parentNode!==slot) slot.appendChild(e);
        e.classList.add('mini');
        e.classList.toggle('staged', side===0 && !c.revealed);
        if(side===1) e.classList.toggle('facedown', !c.revealed);
        setCardPower(e, cardPower(s,c), DEF[c.id].power);
      });
    }
  });

  const hand=s.players[0].hand, handEl=$('#hand');
  const same = handEl.children.length===hand.length && hand.every((c,i)=>handEl.children[i]===M.els.get(c.uid));
  hand.forEach(c=>{
    const e=getEl(c); seen.add(c.uid);
    e.classList.remove('mini','staged','facedown');
    setCardPower(e, c.base+c.bonus, DEF[c.id].power);
    if(!same) handEl.appendChild(e);
  });
  layoutHand();

  for(const [uid,e] of M.els){ if(!seen.has(uid)){ e.remove(); M.els.delete(uid); } }

  const deckR=$('#deckpile').getBoundingClientRect();
  const oppR=$('#opp-av').getBoundingClientRect();
  let ni=0;
  for(const [uid,e] of M.els){
    if(e._isNew){
      e._isNew=false;
      const origin = (opts.origins && opts.origins.get(uid)) || (before.get(uid)) || (e.closest('.zone.them') ? oppR : deckR);
      const r={left:origin.left, top:origin.top, width:Math.max(20,origin.width*0.6), height:Math.max(26,origin.height*0.6)};
      if(before.has(uid)) flip(e, before.get(uid));
      else { flip(e, r, opts.stagger ? (ni++)*110 : 0); }
    } else if(before.has(uid)) flip(e, before.get(uid));
  }
  updateHud();
}

function layoutHand(){
  const handEl=$('#hand'); const kids=[...handEl.children]; const n=kids.length;
  if(!n) return;
  const w=kids[0].getBoundingClientRect().width || 80;
  const avail=handEl.clientWidth-8;
  const gap = n>1 ? Math.min(6, (avail - n*w)/(n-1)) : 0;
  kids.forEach((k,i)=>{ k.style.marginLeft = i===0 ? '0px' : gap+'px'; k.style.zIndex=i+1; });
}

function hasPlayable(){
  const s=M.s;
  return s.players[0].hand.some(c=>[0,1,2].some(li=>!whyCantPlay(s,0,c,li)));
}
function updateHud(){
  if(!M) return;
  const s=M.s, me=s.players[0], ai=s.players[1];
  const e=energyLeft(s,0);
  const en=$('#energy');
  const span=en.querySelector('span');
  if(span.textContent!==String(e)){ span.textContent=e; en.classList.remove('pulse'); void en.offsetWidth; en.classList.add('pulse'); }
  en.classList.toggle('zero', e<=0);
  $('#turn-lbl').textContent = s.turn>=MAX_TURN ? 'Final turn' : `Turn ${Math.max(1,s.turn)}/${MAX_TURN}`;
  $('#end-sub').textContent = M.busy ? (s.turn? 'Revealing…':'Get ready') : `${Math.max(1,s.turn)} / ${MAX_TURN}`;
  const aiHidden=ai.staged.filter(st=>!st.inserted).length;
  const aiBonus = s.turn>0 && ai.energy>s.turn;
  $('#opp-info').innerHTML=`✋ ${ai.hand.length+aiHidden} · 🂠 ${ai.deck.length} · <span class="opp-en${aiBonus?' bonus':''}">⚡${s.turn>0?ai.energy:0}</span>`;
  const eb=$('#en-bonus'); const myBonus=s.turn>0 ? me.energy-s.turn : 0;
  eb.classList.toggle('on', myBonus>0); eb.textContent = myBonus>0 ? '+'+myBonus : '';
  $('#deckpile').textContent=`🂠 ${me.deck.length}`;
  const cube=$('#cube span'); if(cube.textContent!==String(s.stakes)) cube.textContent=s.stakes;
  $('#stake-pend').textContent = s.pendingMult>1 ? `×${s.pendingMult} next turn` : '';
  const btnEnd=$('#btn-end');
  btnEnd.disabled = M.busy || s.over;
  btnEnd.classList.toggle('ready', !M.busy && !s.over && s.turn>0 && (e<=0 || !hasPlayable()));
  const bl=$('#btn-blitz');
  bl.disabled = M.busy || s.over || me.blitzed || s.turn<1;
  bl.querySelector('small').textContent = me.blitzed ? 'Blitzed!' : 'Double stakes';
  $('#btn-retreat').disabled = M.busy || s.over || s.turn<1;
  const firstMe = M.first===0 && s.turn>0 && !s.over;
  $('#opp-first').classList.toggle('on', M.first===1 && s.turn>0 && !s.over);
  $('#you-first').textContent = firstMe ? 'You reveal first' : '';
}

/* ---------- drag & drop ---------- */
let D=null;
function attachDrag(e, c){
  e.addEventListener('pointerdown', ev=>{
    if(ev.pointerType==='mouse' && ev.button!==0) return;
    if(D) return;
    D={ pid:ev.pointerId, e, c, x0:ev.clientX, y0:ev.clientY, x:ev.clientX, y:ev.clientY, drag:false, touch:ev.pointerType!=='mouse', tilt:0, lastX:ev.clientX, target:-1, raf:0 };
    try{ e.setPointerCapture(ev.pointerId); }catch(_){}
  });
}
function canDrag(c){
  if(!M || M.busy || M.s.over) return false;
  if(c.owner!==0) return false;
  const inHand=M.s.players[0].hand.includes(c);
  const staged=M.s.players[0].staged.some(st=>st.card===c) && !c.revealed;
  return inHand || staged;
}
function startDrag(){
  const {e,c}=D;
  const r=e.getBoundingClientRect();
  const handCard=$('#hand .card');
  const gw = handCard ? handCard.getBoundingClientRect().width : Math.min(84, window.innerWidth*0.19);
  const g=buildCardEl(c.id); g.classList.add('ghost');
  g.style.width=gw+'px';
  setCardPower(g, c.revealed?cardPower(M.s,c):c.base+c.bonus, DEF[c.id].power);
  document.body.appendChild(g);
  const scale=gw/r.width;
  D.g=g; D.gw=gw; D.gh=gw*4/3;
  if(D.touch){ D.offX=gw/2; D.offY=D.gh+18; }
  else { D.offX=(D.x0-r.left)*scale; D.offY=(D.y0-r.top)*scale; }
  D.startRect=r;
  D.cols=M.cols.map(col=>col.col.getBoundingClientRect());
  D.handRect=$('.handwrap').getBoundingClientRect();
  D.inHand=M.s.players[0].hand.includes(c);
  e.classList.add('dragsrc');
  D.drag=true;
  vibrate(6);
  // start ghost where the card is, then glide to finger
  g.style.transform=`translate3d(${r.left}px,${r.top}px,0) scale(${1/scale})`;
  g.getBoundingClientRect();
  g.style.transition='transform .12s ease-out';
  moveGhost();
  setTimeout(()=>{ if(D && D.g===g) g.style.transition='none'; },130);
}
function moveGhost(){
  if(!D || !D.g) return;
  const vx=D.x-D.lastX; D.lastX=D.x;
  D.tilt += (Math.max(-16,Math.min(16,vx*1.2)) - D.tilt)*0.3;
  D.g.style.transform=`translate3d(${D.x-D.offX}px,${D.y-D.offY}px,0) rotate(${D.tilt.toFixed(2)}deg) scale(1.08)`;
  // target
  const cy=D.y-(D.touch?D.gh*0.6:0);
  let t=-1;
  if(cy < D.handRect.top-4) D.cols.forEach((r,i)=>{ if(D.x>=r.left-3 && D.x<=r.right+3) t=i; });
  if(t!==D.target){
    M.cols.forEach(col=>{ const z=col.zones[0]; z.classList.remove('ok','bad'); const w=z.querySelector('.why'); if(w) w.remove(); });
    if(t>=0){
      const why=whyCantPlay(M.s,0,D.c,t);
      const z=M.cols[t].zones[0];
      z.classList.add(why?'bad':'ok');
      if(why) z.appendChild(el('div','why',why));
    }
    D.target=t;
  }
  $('#hand').classList.toggle('drop-home', !D.inHand && t<0 && D.y>D.handRect.top-30);
}
window.addEventListener('pointermove', ev=>{
  if(!D || ev.pointerId!==D.pid) return;
  D.x=ev.clientX; D.y=ev.clientY;
  if(!D.drag){
    if(Math.hypot(D.x-D.x0, D.y-D.y0)>7 && canDrag(D.c)) startDrag();
    return;
  }
  ev.preventDefault();
  if(!D.raf) D.raf=requestAnimationFrame(()=>{ if(D){ D.raf=0; moveGhost(); } });
}, {passive:false});
function clearDropUI(){
  M && M.cols && M.cols.forEach(col=>{ const z=col.zones[0]; z.classList.remove('ok','bad'); const w=z.querySelector('.why'); if(w) w.remove(); });
  $('#hand').classList.remove('drop-home');
}
function endPointer(ev, cancelled){
  if(!D || ev.pointerId!==D.pid) return;
  const d=D; D=null;
  if(d.raf) cancelAnimationFrame(d.raf);
  if(!d.drag){
    if(!cancelled && M) handTap(d.c);
    return;
  }
  clearDropUI();
  const s=M.s, g=d.g;
  const gr=g.getBoundingClientRect();
  const t=d.target;
  const why = t>=0 ? whyCantPlay(s,0,d.c,t) : 'none';
  if(!cancelled && t>=0 && !why){
    stage(s,0,d.c,t);
    g.remove(); d.e.classList.remove('dragsrc');
    mRender({ first:new Map([[d.c.uid, gr]]) });
    vibrate(14);
    return;
  }
  if(!cancelled && !d.inHand && t<0 && d.y>d.handRect.top-30){
    unstage(s,0,d.c);
    g.remove(); d.e.classList.remove('dragsrc');
    mRender({ first:new Map([[d.c.uid, gr]]) });
    vibrate(8);
    return;
  }
  if(t>=0 && why && why!=='none') toast(why);
  // return ghost home
  const home=d.e.getBoundingClientRect();
  g.style.transition='transform .3s cubic-bezier(.3,1.3,.5,1)';
  g.style.transform=`translate3d(${home.left}px,${home.top}px,0) scale(${home.width/d.gw})`;
  setTimeout(()=>{ g.remove(); d.e.classList.remove('dragsrc'); }, 300);
}
window.addEventListener('pointerup', ev=>endPointer(ev,false));
window.addEventListener('pointercancel', ev=>endPointer(ev,true));
window.addEventListener('resize', ()=>{ if(M) layoutHand(); });

function handTap(c){
  const s=M.s;
  const isStaged=s.players[0].staged.some(st=>st.card===c) && !c.revealed;
  const inHand=s.players[0].hand.includes(c);
  const power = c.revealed ? cardPower(s,c) : c.base+c.bonus;
  let extra='';
  if(!M.busy && !s.over && (inHand || isStaged)){
    extra=`<p style="font-weight:700;margin:10px 0 4px">${isStaged?'Move to':'Play at'}</p><div class="playat">${s.locs.map((L,li)=>{
      const why=whyCantPlay(s,0,c,li);
      const name=L.revealed?LDEF[L.id].name:'Hidden';
      return `<button class="btn ${why?'':'blue'}" data-li="${li}" ${why?'disabled':''}>${name}${why?`<br><small>${why}</small>`:''}</button>`;
    }).join('')}</div>${isStaged?'<button class="btn block" id="unstage" style="margin-top:8px">Return to hand</button>':''}`;
  }
  cardDetail(c.id, { inMatch:true, power, extra, onMount:box=>{
    box.querySelectorAll('[data-li]').forEach(b=>b.addEventListener('click',()=>{
      closeModal();
      const first=M.els.get(c.uid)?.getBoundingClientRect();
      stage(s,0,c,+b.dataset.li);
      mRender({ first: first?new Map([[c.uid, first]]):null });
      vibrate(14);
    }));
    const u=$('#unstage',box);
    if(u) u.onclick=()=>{ closeModal(); const first=M.els.get(c.uid)?.getBoundingClientRect(); unstage(s,0,c); mRender({ first: first?new Map([[c.uid, first]]):null }); };
  }});
}

/* ---------- energy breakdown ---------- */
function energyBreakdown(side){
  if(!M || M.s.turn<1) return;
  const s=M.s, p=s.players[side];
  const rows=p.energyFrom.map((x,i)=>`<li><span>${i===0?`${esc(x.label)} (base)`:`Bonus from ${esc(x.label)}`}</span><b>+${x.n}</b></li>`).join('');
  const next=p.energyNextFrom.length ? `<p><b>Next turn:</b> ${p.energyNextFrom.map(x=>`+${x.n} from ${esc(x.label)}`).join(', ')}.</p>` : '';
  const used = side===0 ? `<p>You've spent ${p.energy-energyLeft(s,0)} and have ${energyLeft(s,0)} left.</p>` : '';
  openModal(`<h2>${side?esc(M.aiName)+'’s':'Your'} Energy this turn</h2>
    <ul class="en-list">${rows}<li class="total"><span>Total</span><b>${p.energy}</b></li></ul>${used}${next}
    <p style="color:var(--muted);font-size:13px">Each turn gives Energy equal to the turn number. Cards that give "+Energy next turn" and locations that reward whoever is winning there add bonus Energy. Both players follow the same rules.</p>
    <button class="btn block" data-close>Close</button>`);
}
$('#opp-box').addEventListener('click',()=>energyBreakdown(1));
$('#energy').addEventListener('click',()=>energyBreakdown(0));
['#opp-box','#energy'].forEach((sel,i)=>$(sel).addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); energyBreakdown(i===0?1:0); } }));

/* ---------- banners & effects ---------- */
async function banner(text, sub='', ms=1150, cls=''){
  const b=el('div','banner '+cls, `<div class="strip"><b>${text}</b>${sub?`<small>${sub}</small>`:''}</div>`);
  $('#scr-match').appendChild(b);
  await sleep(ms);
  b.remove();
}
function cubeBoom(){
  const c=$('#cube'); c.classList.remove('boom'); void c.offsetWidth; c.classList.add('boom');
  const r=c.getBoundingClientRect(); burst(r.left+r.width/2, r.top+r.height/2, ['#2f6bff','#ffd23f','#fff'], 18, 120);
}

/* ---------- turn flow ---------- */
async function startTurnUI(){
  const s=M.s;
  M.busy=true;
  const ev=[];
  startTurn(s, ev);
  M.first=firstRevealer(s);
  updateHud();
  await banner(s.turn===MAX_TURN?'FINAL TURN':`TURN ${s.turn}`, s.turn===MAX_TURN?'Make it count':`${s.players[0].energy} Energy`, 950, s.turn===MAX_TURN?'red':'');
  if(ev.some(x=>x.t==='stakes')) cubeBoom();
  // point out bonus Energy so nobody is surprised by a big early play
  [[1,$('#opp-av')],[0,$('#energy')]].forEach(([side,node])=>{ const extra=s.players[side].energy-s.turn; if(extra>0) setTimeout(()=>floatText(node, `+${extra} Energy`, 'good'), 150); });
  const locEv=ev.find(x=>x.t==='loc');
  mRender({ stagger:true });
  if(locEv){
    vibrate(10);
    await sleep(750);
    const r=M.cols[locEv.li].loc.getBoundingClientRect();
    burst(r.left+r.width/2, r.top+r.height/2, [LDEF[s.locs[locEv.li].id].color,'#fff'], 14, 90);
  } else await sleep(350);
  // tell the player when a location closes, and on its last open turn
  s.locs.forEach((L,li)=>{
    if(!L.revealed || !M) return;
    if(isLastOpenTurn(s,li)) floatText(M.cols[li].loc, 'Last turn here!', 'info');
    else if(ldef(s,li).type==='closeAfter' && s.turn===ldef(s,li).n+1) floatText(M.cols[li].loc, 'Closed!', 'bad');
  });
  if(!M) return;
  // AI decides (without seeing your moves this turn)
  const plan=aiPlan(s,1);
  const dec=aiDecide(s,1,plan.prob);
  if(dec==='retreat'){
    await banner(`${M.aiName} retreats!`,`You win ${s.stakes} cube${s.stakes>1?'s':''}`,1400);
    retreat(s,1);
    return endMatchUI();
  }
  if(dec==='blitz' && blitz(s,1)){
    await banner('OPPONENT BLITZED','Stakes double next turn',1200,'red');
    cubeBoom();
  }
  applyAiPlan(s,1,plan.plan);
  M.busy=false;
  updateHud();
}

async function endTurnUI(){
  if(!M || M.busy || M.s.over) return;
  const s=M.s;
  M.busy=true; updateHud();
  commitPlays(s);
  mRender();
  const aiCount=s.players[1].staged.length;
  if(aiCount) await sleep(520);
  const first=M.first;
  const order=[...s.players[first].staged, ...s.players[1-first].staged].map(st=>st.card);
  if(order.length) toast(first===0?'You reveal first':`${M.aiName} reveals first`);
  for(const c of order){
    if(!M) return;
    if(c.loc<0 || c.revealed) continue;
    const ev=[];
    // capture positions of anything that might be destroyed
    revealCard(s,c,ev);
    await animateReveal(c, ev);
  }
  const ev=[];
  endOfTurn(s,ev);
  if(ev.length){
    mRender();
    ev.forEach(x=>{ if(x.t==='pow') floatText(M.els.get(x.uid), (x.d>0?'+':'')+x.d, x.d>0?'good':'bad'); });
    await sleep(700);
  }
  if(s.turn>=MAX_TURN){
    finishMatch(s);
    return endMatchUI();
  }
  await startTurnUI();
}

async function animateReveal(c, ev){
  // pull destroyed cards out as floating debris before re-render
  ev.filter(x=>x.t==='destroy').forEach(x=>{
    const e=M.els.get(x.uid); if(!e) return;
    const r=e.getBoundingClientRect();
    M.els.delete(x.uid);
    e.classList.add('dying');
    Object.assign(e.style,{left:r.left+'px', top:r.top+'px', width:r.width+'px', transform:'', transition:'none'});
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),650);
  });
  const origins=new Map();
  ev.filter(x=>x.t==='summon').forEach(x=>{ const src=M.els.get(x.from); if(src) origins.set(x.uid, src.getBoundingClientRect()); });
  mRender({ origins });
  const e=M.els.get(c.uid);
  if(e){ e.classList.remove('revealing'); void e.offsetWidth; e.classList.add('revealing'); setTimeout(()=>e.classList.remove('revealing'),650); }
  vibrate(c.owner===0?10:6);
  await sleep(c.owner===1?560:360);
  let effects=false;
  for(const x of ev){
    if(x.t==='pow' && x.uid===c.uid && ev.length<=2 && !DEF[c.id].ability){ floatText(M.els.get(x.uid), (x.d>0?'+':'')+x.d, x.d>0?'good':'bad'); effects=true; continue; }
    if(x.t==='pow'){ floatText(M.els.get(x.uid), (x.d>0?'+':'')+x.d, x.d>0?'good':'bad'); effects=true; }
    if(x.t==='text'){ floatText(M.els.get(x.uid), x.text, 'info'); effects=true; }
    if(x.t==='hand' && x.side===0){ [...$('#hand').children].forEach(h=>floatText(h,'+'+x.d,'good')); effects=true; }
    if(x.t==='hand' && x.side===1){ floatText($('#opp-av'),'Hand +'+x.d,'info'); effects=true; }
    if(x.t==='destroy'){ effects=true; vibrate(30); }
    if(x.t==='draw' || x.t==='add' || x.t==='summon') effects=true;
  }
  if(effects) await sleep(620);
}

async function endMatchUI(){
  const s=M.s, r=s.result;
  M.busy=true; updateHud();
  if(!r.retreat){
    await banner('FINAL REVEAL','Stakes double',1000);
    cubeBoom(); updateHud();
    await sleep(300);
    r.locWinners.forEach((w,li)=>M.cols[li].col.classList.add(w===0?'won':w===1?'lost':'tied'));
    r.locWinners.forEach((w,li)=>{ if(w===0){ const rr=M.cols[li].loc.getBoundingClientRect(); burst(rr.left+rr.width/2, rr.top+rr.height/2, ['#ffd23f','#fff'], 14, 100); } });
    await sleep(1500);
  }
  let gold, delta;
  if(r.winner===0){ gold=40+15*r.stakes; delta=r.stakes; SAVE.wins++; }
  else if(r.winner===1){ gold=r.retreat?10:15; delta=-r.stakes; SAVE.losses++; }
  else { gold=25; delta=0; SAVE.draws++; }
  const prevRank=SAVE.rank;
  SAVE.rank=Math.max(0, SAVE.rank+delta);
  SAVE.gold+=gold; persist();
  const t=$('#res-title');
  t.className='res-title '+(r.winner===0?'win':r.winner===1?'lose':'draw');
  t.textContent = r.winner===0?'VICTORY!':r.winner===1?'DEFEAT':'DRAW';
  let sub;
  if(r.retreat) sub = r.retreater===0 ? 'You retreated and kept your losses small.' : `${M.aiName} retreated.`;
  else { const won=r.locWinners.filter(x=>x===0).length, lost=r.locWinners.filter(x=>x===1).length; sub = r.winner<0 ? 'Even on locations and total Power.' : `Locations ${won}–${lost}` + (won===lost?` · Power ${r.tp[0]}–${r.tp[1]}`:''); }
  $('#res-sub').textContent=sub;
  const lvlUp=Math.floor(SAVE.rank/10)>Math.floor(prevRank/10);
  $('#res-rows').innerHTML=`<div class="res-row"><b style="color:${delta>0?'var(--good)':delta<0?'var(--bad)':'inherit'}">${delta>0?'+':''}${delta}</b><small>Cubes</small></div><div class="res-row"><b style="color:var(--gold)">+${gold}</b><small>Gold</small></div><div class="res-row"><b>${Math.floor(SAVE.rank/10)+1}</b><small>${lvlUp?'Rank up!':'Rank'}</small></div>`;
  $('#result').classList.add('open');
  if(r.winner===0){ setTimeout(()=>burst(window.innerWidth/2, window.innerHeight*0.35, ['#ffd23f','#e8323c','#2f6bff','#fff'], 44, 260), 350); vibrate([20,60,20]); }
}
function leaveMatch(){
  $('#result').classList.remove('open');
  if(M){ for(const e of M.els.values()) e.remove(); }
  M=null;
  $('#board').innerHTML=''; $('#hand').innerHTML='';
}
$('#res-home').addEventListener('click',()=>{ leaveMatch(); show('home'); });
$('#res-again').addEventListener('click',()=>{ leaveMatch(); startMatch(); });
$('#btn-end').addEventListener('click',endTurnUI);
$('#btn-blitz').addEventListener('click',async()=>{
  if(!M || M.busy) return;
  if(blitz(M.s,0)){ vibrate([15,30,15]); cubeBoom(); updateHud(); banner('BLITZ!','Stakes double next turn',900); }
});
$('#btn-retreat').addEventListener('click',async()=>{
  if(!M || M.busy || M.s.over) return;
  const s=M.s;
  if(await confirmModal('Retreat?',`You'll lose ${s.stakes} cube${s.stakes>1?'s':''} now instead of risking ${s.stakes*s.pendingMult*2} at the end.`,'Retreat')){
    if(!M || M.busy) return;
    retreat(s,0); endMatchUI();
  }
});

/* ---------- boot ---------- */
applyTheme();
document.title = SETTINGS.gameTitle || document.title;
$('#logo').innerHTML = `<span class="l1">${esc(TITLE_WORDS[0])}</span>${TITLE_WORDS.length>1?`<span class="l2">${esc(TITLE_WORDS.slice(1).join(' '))}</span>`:''}`;
ensureFeatured();
show('home');
window.__gameStarted = true;
if(CONTENT_ERRORS.length){ console.warn('Content problems:', CONTENT_ERRORS); setTimeout(()=>showContentWarnings(CONTENT_ERRORS), 300); }
if(!SAVE.seenRules){ SAVE.seenRules=true; persist(); setTimeout(showRules, 500); }
</script>
<script src="dev-tools.js"></script>
</body>
