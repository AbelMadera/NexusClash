<script>
/* Shows a plain-English message if there's a typo in the cards section below.
   You don't need to edit this part. */
window.addEventListener('error', function(ev){
  if (window.__gameStarted) return;
  // keep the FIRST error: later ones are usually side effects of it
  var e = window.__bootError = window.__bootError || ev;
  var show = function(){
    if (document.getElementById('boot-error')) return;
    var d = document.createElement('div'); d.id = 'boot-error';
    d.innerHTML = '<div class="be-box"><h2>The game couldn\u2019t start</h2><p>Something in the file has a typo' +
      (e.lineno ? ' at or just above <b>line ' + e.lineno + '</b>' : '') + '. The browser says:</p><pre></pre>' +
      '<p>Usual suspects: a missing comma between two cards, a missing quote mark, or a missing <code>}</code>. ' +
      'Open the file in a text editor, fix that line, save, and refresh.</p></div>';
    d.querySelector('pre').textContent = e.message || String(e.error || 'Unknown error');
    document.body.appendChild(d);
  };
  if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
});
</script>
<script>
/* ╔═══════════════════════════════════════════════════════════════════════╗
   ║  NEXUS CLASH · YOUR CARDS AND LOCATIONS                               ║
   ║  Everything you'll want to change lives in this block.                ║
   ║  Full guide: README.md          Image helper: card-maker.html         ║
   ╚═══════════════════════════════════════════════════════════════════════╝

   ADD A CARD IN 3 STEPS
     1. Copy any card line below, from {  to  },
     2. Paste it on a new line inside CARDS and change the values.
     3. Give it a new id (lowercase letters/numbers, no spaces), save, refresh.
   If you make a typo, the game shows a message telling you what to fix.

   CARD FIELDS
     id        unique code name, e.g. "firehawk"  (never shown to players)
     name      the name players see
     cost      energy needed to play it, 0 to 6
     power     starting power
     rarity    "common", "rare", "epic" or "legendary"
     emoji     picture used when there's no image
     color     card background, e.g. "#e8323c"
     image     ""                          → no image, uses the emoji
               "images/firehawk.png"       → a file in the images folder
               "data:image/jpeg;base64,…"  → pasted from card-maker.html
               Any image works: it's cropped to fill the card automatically.
     imagePos  (optional) which part of the image to keep, e.g. "50% 20%"
               ("left right%  top bottom%"; "50% 0%" keeps the top middle)
     ability   leave it out for a vanilla card, or  { effect:"draw", amount:1 }
     text      (optional) your own ability wording; normally it's automatic
     token     (optional) true = only created by other cards, never in packs

   CARD EFFECTS          [n] = use  amount:n
     On Reveal — happens once, when the card flips face up
       buffAlliesHere [n]       your other cards here get +n Power
       debuffEnemiesHere [n]    enemy cards here get −n Power
       draw [n]                 draw n cards
       energyNext [n]           +n Energy next turn
       buffHand [n]             cards in your hand get +n Power
       summon                   put a token at another location   needs  token:"id"
       addCard                  add a card to your hand           needs  card:"id"
       ifAlone [n]              +n Power if it's your only card here
       perAlly [n]              +n Power for each of your other cards here
       finalTurn [n]            +n Power if played on the final turn
       destroyWeakest           destroy the enemy card here with the least Power
       buffRandomAlly [n]       another random card of yours gets +n Power
     Ongoing — active the whole time the card is on the board
       auraAlliesHere [n]       your other cards here have +n Power
       auraEnemiesHere [n]      enemy cards here have −n Power
       auraAlliesEverywhere [n] all your other cards have +n Power
       locationBonus [n]        +n to your total Power at this location
     End of turn
       grow [n]                 this card gains +n Power at the end of every turn
*/

  { id:"spark",        name:"Spark Runner",    cost:1, power:2,    rarity:"common",      emoji:"⚡", color:"#d5b534", image:"" },

  { id:"banner",       name:"Bannerbearer",    cost:2, power:1,    rarity:"rare",        emoji:"🚩", color:"#d53441", image:"", ability:{ effect:"auraAlliesHere", amount:1 } },

  { id:"drake",        name:"Ember Drake",     cost:5, power:6,    rarity:"rare",        emoji:"🐉", color:"#d54934", image:"", ability:{ effect:"debuffEnemiesHere", amount:1 } },
  { id:"warlord",      name:"Warlord",         cost:5, power:3,    rarity:"epic",        emoji:"🪖", color:"#a0d534", image:"", ability:{ effect:"perAlly", amount:2 } },
  { id:"queen",        name:"Tempest Queen",   cost:5, power:4,    rarity:"legendary",   emoji:"👑", color:"#9234d5", image:"", ability:{ effect:"auraAlliesEverywhere", amount:1 } },
  { id:"behemoth",     name:"Behemoth",        cost:6, power:10,   rarity:"common",      emoji:"🦖", color:"#34d56a", image:"" },
  { id:"starforged",   name:"Starforged",      cost:6, power:8,    rarity:"legendary",   emoji:"🌟", color:"#d5ad34", image:"", ability:{ effect:"buffAlliesHere", amount:2 } },
  { id:"voidking",     name:"Void Sovereign",  cost:6, power:7,    rarity:"legendary",   emoji:"🌌", color:"#3434d5", image:"", ability:{ effect:"auraEnemiesHere", amount:2 } },
  { id:"carlos", name:"Carlos", cost:2, power:2, rarity:"epic", emoji:"❔", color:"#e8323c", image: "images/carlos.png" , ability:{ effect:"grow", amount:1 } },

  // Tokens: made by other cards (summon / addCard / the Barracks location).
  // Keep "recruit" — the Barracks location needs it.
  { id:"illusion",     name:"Illusion",        cost:1, power:2,    rarity:"common",      emoji:"👻", color:"#8534d5", image:"", token:true },
  { id:"drone",        name:"Drone",           cost:1, power:2,    rarity:"common",      emoji:"🤖", color:"#34bad5", image:"", token:true },
  { id:"recruit",      name:"Recruit",         cost:1, power:2,    rarity:"common",      emoji:"⚔️", color:"#d58534", image:"", token:true },

/* LOCATION FIELDS
     id, name, emoji, color, image, imagePos   work the same as on cards
     effect    one of the location effects below
     amount    the number that effect uses
     text      (optional) your own wording; normally it's automatic

   LOCATION EFFECTS      [n] = use  amount:n
     none                 no effect
     playBonus [n]        cards played here get +n Power (use a minus number for −n)
     capacity [n]         each side can only have n cards here (normally 4)
     costReduction [n]    cards cost n less to play here
     closeAfter [n]       closed after turn n: no cards can be played or added here
     doubleReveal         On Reveal abilities here happen twice
     bigBonus [n]         cards that cost 5 or more have +n Power here
     smallOnly [n]        only cards that cost n or less can be played here
     recruit              every turn, both players get a Recruit card in hand
     drawOnPlay           when a card is played here, its owner draws a card
     growHere [n]         at the end of every turn, cards here get +n Power
     energyWinner [n]     whoever is winning here gets +n Energy each turn
     underdog [n]         the side with fewer cards here (at least 1) gets +n Power
   A match uses 3 random locations, so keep at least 3 in this list.
*/
const LOCATIONS = [
  { id:"plaza",     name:"Hero Plaza",      emoji:"🏙️", color:"#307fcf", image:"", effect:"none" },
  { id:"forge",     name:"Solar Forge",     emoji:"🔥", color:"#cf6530", image:"", effect:"playBonus", amount:2 },

  { id:"library",   name:"Arcane Library",  emoji:"📚", color:"#6530cf", image:"", effect:"drawOnPlay" },
  { id:"glade",     name:"Verdant Glade",   emoji:"🌿", color:"#30cf65", image:"", effect:"growHere", amount:1 },
  { id:"ley",       name:"Ley Nexus",       emoji:"💠", color:"#30c1cf", image:"", effect:"energyWinner", amount:1 },

/* ───────────── SHOP, STARTER AND REWARD SETTINGS ───────────── */

// price = shop price for a single card. duplicateGold = gold you get for a duplicate from a pack.
const RARITIES = {

// odds are percentages. guarantee = at least one card of this rarity (or better).
const PACKS = [
  { id:"basic",  name:"Basic Pack",  cards:3, price:100, color:"#2f8fe0", odds:{ common:70, rare:24, epic:5,  legendary:1 } },
  { id:"hero",   name:"Hero Pack",   cards:5, price:250, color:"#9b3fe0", odds:{ common:55, rare:32, epic:10, legendary:3 }, guarantee:"rare" },

// Ready-made decks sold in the shop. Each needs exactly 12 card ids. The computer opponent uses these too.
const BUNDLES = [
  { id:"frost",  name:"Frost & Fury",  emoji:"❄️", color:"#2fb4d6", price:1100, blurb:"Shrink enemy cards, then crush them.",
    cards:["spark","shieldling","frostbite","ironcub","viper","thunderknight","witch","colossus","drake","titanfist","voidking","behemoth"] },

    cards:["spark","shieldling","pixie","mirage","banner","ironcub","tinkerer","priestess","warden","warlord","queen","starforged"] },
  { id:"titans", name:"Titan Surge",   emoji:"🗿", color:"#d9812f", price:900,  blurb:"Ramp up and slam the biggest hitters.",
    cards:["nightowl","seedling","lonewolf","ironcub","rogue","elderoak","colossus","oracle","shadowblade","titanfist","drake","behemoth"] },

// Cards a new player owns, and their first deck (exactly 12, all from STARTER_CARDS).
const STARTER_CARDS = ["spark","shieldling","nightowl","ironcub","quartermaster","frostbite","thunderknight","tinkerer","colossus","warden","titanfist","behemoth","pixie","mirage"];

</script>

<style>
/* ============ TOKENS ============ */
:root{
  --bg:#dfe6f2; --bg-2:#c9d4e8; --panel:#ffffff; --panel-2:#eef2f9; --ink:#14142b; --muted:#566081;
  --line:rgba(20,20,43,.14); --outline:#14142b;
  --red:#e8323c; --red-dk:#a51d26; --blue:#2f6bff; --blue-dk:#1a44b8; --yellow:#ffd23f; --yellow-dk:#c99a00;
  --gold:#b27a00; --good:#11994a; --bad:#d8283d;
  --zone:rgba(47,107,255,.08); --zone-line:rgba(20,20,43,.16); --loc-bg:#ffffff;
  --dots:rgba(20,20,43,.07);
  --shadow:0 3px 0 var(--outline);
  --display:'Bangers', Impact, 'Arial Narrow', sans-serif;
  --ui:'Rubik', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12132a; --bg-2:#1b1d3d; --panel:#1f2247; --panel-2:#282c58; --ink:#f1f2ff; --muted:#a3a8d4;
    --line:rgba(255,255,255,.12); --outline:#05050f;
    --gold:#ffd23f; --good:#35d983; --bad:#ff5468;
    --zone:rgba(120,150,255,.08); --zone-line:rgba(255,255,255,.12); --loc-bg:#262a55;
    --dots:rgba(255,255,255,.045);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12132a; --bg-2:#1b1d3d; --panel:#1f2247; --panel-2:#282c58; --ink:#f1f2ff; --muted:#a3a8d4;
  --line:rgba(255,255,255,.12); --outline:#05050f;
  --gold:#ffd23f; --good:#35d983; --bad:#ff5468;
  --zone:rgba(120,150,255,.08); --zone-line:rgba(255,255,255,.12); --loc-bg:#262a55;
  --dots:rgba(255,255,255,.045);
  color-scheme:dark;
}

/* ============ BASE ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#app{position:relative;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;overflow:clip;
  background:
    radial-gradient(var(--dots) 1.2px, transparent 1.4px) 0 0/9px 9px,
    linear-gradient(180deg,var(--bg),var(--bg-2));
  box-shadow:0 0 0 1px var(--line)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateY(10px);
  transition:opacity .25s ease, transform .25s ease, visibility 0s linear .25s}
.screen.active{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 14px calc(92px + env(safe-area-inset-bottom))}

/* ============ BUTTONS ============ */
.btn{border:2.5px solid var(--outline);border-radius:12px;padding:10px 16px;background:var(--panel);font-weight:700;font-size:15px;
  box-shadow:0 3px 0 var(--outline);transition:transform .08s, box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--outline)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.primary{background:var(--red);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.yellow{background:var(--yellow);color:#14142b}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px;border-width:2px;box-shadow:0 2px 0 var(--outline)}
.btn.xs{padding:3px 8px;font-size:12px;border-radius:8px;border-width:2px;box-shadow:0 2px 0 var(--outline)}
.btn.block{display:block;width:100%}
.icon-btn{width:40px;height:40px;border-radius:12px;border:2.5px solid var(--outline);background:var(--panel);font-size:18px;box-shadow:0 3px 0 var(--outline)}
.icon-btn:active{transform:translateY(3px);box-shadow:none}

/* ============ HEADER / NAV ============ */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 8px}
.hdr .title{font:34px/1 var(--display);letter-spacing:1px}
.hdr-right{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:2.5px solid var(--outline);background:var(--panel);font-weight:800;font-size:15px;box-shadow:0 2px 0 var(--outline)}
.pill b{color:var(--gold)}
.logo{font:40px/.85 var(--display);letter-spacing:1px;color:var(--red);-webkit-text-stroke:1.5px var(--outline);text-shadow:3px 3px 0 var(--outline);transform:rotate(-3deg)}
.logo span{display:block;color:var(--yellow);font-size:30px;margin-left:18px}
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:50;display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:var(--panel);border-top:2.5px solid var(--outline);transition:transform .3s ease}
.tabbar.hide{transform:translateY(110%)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;padding:6px 0;border-radius:12px;font-size:12px;font-weight:700;color:var(--muted)}
.tab i{font-style:normal;font-size:22px;transition:transform .2s}
.tab.on{color:var(--ink);background:var(--panel-2)}
.tab.on i{transform:translateY(-2px) scale(1.12)}
.tab.center i{font-size:26px}
.tab:focus-visible{outline:3px solid var(--blue)}

/* ============ CARD ============ */
.card{position:relative;width:var(--cw,90px);aspect-ratio:3/4;flex:none;container-type:inline-size;transform-origin:0 0}
#scr-match .card,.card.ghost{touch-action:none}
.card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.35,.5,1)}
.card.facedown .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:8cqw;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.front{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 86%,#fff),color-mix(in srgb,var(--c) 48%,#000));
  border:3cqw solid var(--outline);box-shadow:inset 0 0 0 2.2cqw var(--rc)}
.front::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.22) 1.1cqw,transparent 1.3cqw) 0 0/7cqw 7cqw;
  -webkit-mask:linear-gradient(200deg,#000,transparent 70%);mask:linear-gradient(200deg,#000,transparent 70%)}
.front::after{content:"";position:absolute;left:-10%;right:-10%;top:52%;height:40%;background:rgba(0,0,0,.18);transform:skewY(-12deg)}
.c-icon{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:46cqw;line-height:1;z-index:1;filter:drop-shadow(1.5cqw 2.5cqw 0 rgba(0,0,0,.45))}
.c-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;pointer-events:none;-webkit-user-drag:none}
.has-art .c-icon{display:none}
.front.has-art::before{display:none}
.front.has-art::after{left:0;right:0;top:auto;bottom:0;height:45%;transform:none;background:linear-gradient(transparent,rgba(0,0,0,.45))}
.c-cost,.c-pow{position:absolute;top:3cqw;z-index:2;display:grid;place-items:center;width:29cqw;height:29cqw;color:#fff;
  font:21cqw/1 var(--display);-webkit-text-stroke:.6cqw var(--outline);paint-order:stroke}
.c-cost{left:3cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7fb0ff,var(--blue) 55%,var(--blue-dk));border:2cqw solid var(--outline)}
.c-pow{right:3cqw;background:var(--outline);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.c-pow::before{content:"";position:absolute;inset:2.4cqw;background:linear-gradient(#ffb547,#e2560b);clip-path:inherit;z-index:-1}
.c-pow span{position:relative}
.card.up .c-pow::before{background:linear-gradient(#6ff0a4,#11994a)}
.card.down .c-pow::before{background:linear-gradient(#ff8a96,#c41b30)}
.c-name{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:2cqw 4cqw 4cqw;background:var(--outline);color:#fff;
  font:13.5cqw/1.05 var(--display);letter-spacing:.3px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-abil{position:absolute;right:4cqw;bottom:21cqw;z-index:2;min-width:17cqw;height:17cqw;padding:0 3cqw;border-radius:9cqw;background:var(--yellow);
  color:#14142b;border:1.6cqw solid var(--outline);font:700 10cqw/14cqw var(--ui);text-align:center}
.back{transform:rotateY(180deg);background:repeating-linear-gradient(135deg,#2a2466 0 7cqw,#352d85 7cqw 14cqw);border:3cqw solid var(--outline);
  box-shadow:inset 0 0 0 2.2cqw #8c7cff;display:grid;place-items:center}
.back-logo{font:40cqw/1 var(--display);color:var(--yellow);-webkit-text-stroke:1cqw var(--outline);paint-order:stroke;transform:rotate(-8deg)}
.card.mini .c-name,.card.mini .c-cost,.card.mini .c-abil{display:none}
.card.mini .c-icon{font-size:56cqw;top:56%}
.card.mini .c-pow{width:40cqw;height:40cqw;font-size:30cqw;top:2cqw;right:2cqw}
.card.compact .c-name{display:none}
.card.compact .c-icon{top:55%}
.card.staged .front{animation:stagedPulse 1.2s ease-in-out infinite}
@keyframes stagedPulse{50%{filter:brightness(1.18);box-shadow:inset 0 0 0 2.2cqw #fff}}
.card.revealing::before{content:"";position:absolute;inset:-8%;border-radius:12cqw;z-index:5;pointer-events:none;
  box-shadow:0 0 0 3px #fff,0 0 18px 8px var(--rc);animation:ringOut .6s ease-out forwards}
@keyframes ringOut{from{transform:scale(.85);opacity:1}to{transform:scale(1.25);opacity:0}}
.card.dragsrc{opacity:.25}
.ghost{position:fixed!important;left:0;top:0;z-index:1000;pointer-events:none;will-change:transform;filter:drop-shadow(0 16px 14px rgba(0,0,0,.45))}
.dying{position:fixed!important;z-index:900;pointer-events:none;animation:shatter .6s ease-in forwards}
@keyframes shatter{30%{transform:scale(1.15) rotate(-6deg);filter:brightness(2)}100%{transform:scale(.4) rotate(25deg) translateY(30px);opacity:0;filter:brightness(3) blur(3px)}}
.pop-in{animation:popIn .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes popIn{from{transform:scale(.4);opacity:0}}

/* ============ PAGES (swipe between Decks · Home · Shop) ============ */
.pages{position:absolute;inset:0;display:flex;transition:transform .38s cubic-bezier(.22,.9,.25,1);will-change:transform}
.pages.dragging{transition:none}
.pages>.screen{position:relative;inset:auto;flex:0 0 100%;width:100%;height:100%;opacity:1;visibility:visible;transform:none;transition:none}
#app.in-match .pages,#app.in-match .pages>.screen{visibility:hidden}

/* ============ HOME ============ */
.logo{display:flex;flex-direction:column;line-height:.85;text-transform:uppercase}
.logo .l1{font:40px/.85 var(--display);letter-spacing:1px;color:var(--red);-webkit-text-stroke:1.5px var(--outline);text-shadow:3px 3px 0 var(--outline);transform:rotate(-3deg)}
.logo .l2{font:30px/.85 var(--display);letter-spacing:1px;color:var(--yellow);-webkit-text-stroke:1.5px var(--outline);text-shadow:3px 3px 0 var(--outline);margin-left:18px;transform:rotate(-3deg)}
.logo span{display:block}
.home{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:4px 14px calc(78px + env(safe-area-inset-bottom))}
.rank-wrap{position:relative;z-index:5}
.rank-card{display:flex;width:100%;align-items:center;gap:12px;text-align:left;background:var(--panel);border:2.5px solid var(--outline);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
.rank-card:active{transform:translateY(3px);box-shadow:none}
.rank-badge{width:56px;height:56px;flex:none;display:grid;place-items:center;align-content:center;background:var(--blue);color:#fff;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.rank-badge small{font-size:9px;font-weight:800;opacity:.85}
.rank-badge b{font:28px/1 var(--display)}
.rank-info{flex:1;min-width:0;display:block}
.rank-bar{display:block;height:12px;border-radius:99px;border:2px solid var(--outline);background:var(--panel-2);overflow:hidden}
.rank-bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--blue) 0 6px,#4f84ff 6px 12px);transition:width .6s ease}
.rank-info small{display:block;margin-top:5px;color:var(--muted);font-size:12px;font-weight:600}
.wl{font-size:13px;color:var(--muted);text-align:right;line-height:1.35}
.wl b{color:var(--ink);font-size:16px}
.gift-pop{position:absolute;right:10px;top:calc(100% + 12px);display:flex;align-items:center;gap:8px;text-align:left;border:2.5px solid var(--outline);border-radius:14px;
  background:var(--yellow);color:#14142b;padding:7px 12px 7px 8px;box-shadow:0 3px 0 var(--outline);transform-origin:80% -10px;
  animation:giftIn .55s cubic-bezier(.3,1.6,.5,1) .3s both, giftBob 2.6s ease-in-out 1s infinite}
.gift-pop[hidden]{display:none}
.gift-pop::before{content:"";position:absolute;top:-8.5px;right:34px;width:13px;height:13px;background:var(--yellow);border-left:2.5px solid var(--outline);border-top:2.5px solid var(--outline);transform:rotate(45deg)}
.gift-pop i{font-style:normal;font-size:28px;line-height:1;animation:giftWiggle 2.6s ease-in-out 1s infinite}
.gift-pop b{display:block;font-size:14px}
.gift-pop small{display:block;font-size:11px;font-weight:600}
.gift-pop:active{transform:translateY(3px);box-shadow:none}
.gift-pop.claim{animation:giftOut .32s ease-in forwards}
@keyframes giftIn{from{transform:scale(0);opacity:0}}
@keyframes giftOut{to{transform:scale(0);opacity:0}}
@keyframes giftBob{50%{translate:0 -3px}}
@keyframes giftWiggle{0%,70%,100%{rotate:0deg}76%{rotate:-14deg}84%{rotate:12deg}92%{rotate:-6deg}}
.coin{position:fixed;z-index:900;left:0;top:0;font-size:20px;pointer-events:none;transition:transform .6s cubic-bezier(.5,-.3,.7,1),opacity .6s}
.home-stage{position:relative;flex:1;min-height:140px;display:flex;align-items:center;justify-content:center}
.showcase{position:relative;width:100%;height:100%;display:flex;justify-content:center;align-items:center}
.showcase .sc{position:absolute;animation:floaty 4.5s ease-in-out infinite}
.showcase .sc .card{--cw:clamp(96px,min(30vw,21dvh),148px);cursor:pointer}
.showcase .sc0{transform:translateX(-64%) rotate(-12deg) scale(.84);animation-delay:-1.4s}
.showcase .sc1{z-index:2}
.showcase .sc2{transform:translateX(64%) rotate(12deg) scale(.84);animation-delay:-2.8s}
.showcase .burst-bg{position:absolute;inset:-10%;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,210,63,.3) 0 8deg,transparent 8deg 20deg);
  -webkit-mask:radial-gradient(circle at 50% 50%,#000 18%,transparent 62%);mask:radial-gradient(circle at 50% 50%,#000 18%,transparent 62%);animation:spin 40s linear infinite}
.showcase .fan{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.showcase .fan.out-l{animation:fanOutL .22s ease-in forwards}
.showcase .fan.out-r{animation:fanOutR .22s ease-in forwards}
.showcase .fan.in-l{animation:fanInL .34s cubic-bezier(.2,1.2,.4,1)}
.showcase .fan.in-r{animation:fanInR .34s cubic-bezier(.2,1.2,.4,1)}
@keyframes fanOutL{to{transform:translateX(-40%);opacity:0}}
@keyframes fanOutR{to{transform:translateX(40%);opacity:0}}
@keyframes fanInL{from{transform:translateX(40%);opacity:0}}
@keyframes fanInR{from{transform:translateX(-40%);opacity:0}}
.showcase .empty-deck{position:relative;text-align:center;color:var(--muted);font-weight:600;max-width:220px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{50%{translate:0 -8px}}

/* play bar: deck · PLAY · rank (Snap-style) */
.playbar{position:relative;display:grid;grid-template-columns:1fr minmax(150px,1.35fr) 1fr;align-items:center;margin:0 -6px;min-height:120px}
.playbar::before{content:"";position:absolute;left:0;right:0;top:20px;bottom:10px;background:var(--panel);border:2.5px solid var(--outline);border-radius:18px;
  clip-path:polygon(0 12%,6% 0,94% 0,100% 12%,100% 100%,0 100%);box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.pb-side{position:relative;z-index:1;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;border:0;background:none;padding:0 4px 18px;min-width:0}
.pb-side:active{transform:translateY(2px)}
.pb-side b{max-width:100%;font:16px/1 var(--display);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-side small{font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.pb-deck.warn small{color:var(--bad)}
.pb-stack{position:relative;width:56px;height:62px;margin-bottom:2px}
.pb-stack .card{--cw:40px;position:absolute;left:8px;top:4px}
.pb-stack .card:first-child{transform:rotate(-10deg) translate(-6px,2px)}
.pb-stack .card:nth-child(2){transform:rotate(8deg) translate(7px,0)}
.pb-stack::after{content:"";position:absolute;left:4px;right:4px;bottom:-4px;height:10px;border-radius:50%;background:radial-gradient(color-mix(in srgb,var(--blue) 60%,transparent),transparent 70%)}
.pb-play-wrap{position:relative;z-index:2;filter:drop-shadow(0 5px 0 var(--outline))}
.play-btn{display:block;width:100%;border:0;padding:3px;background:var(--outline);color:#fff;
  clip-path:polygon(10% 0,90% 0,100% 50%,90% 100%,10% 100%,0 50%);transition:transform .1s}
.play-btn .pb-face{display:flex;flex-direction:column;align-items:center;justify-content:center;height:94px;
  clip-path:polygon(10% 0,90% 0,100% 50%,90% 100%,10% 100%,0 50%);
  background:linear-gradient(180deg,#ff6a72 0%,var(--red) 45%,#b81f29 100%)}
.play-btn .pb-face::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.18) 1px,transparent 1.3px) 0 0/6px 6px;clip-path:inherit;pointer-events:none}
.pb-word{position:relative;font:52px/1 var(--display);letter-spacing:3px;-webkit-text-stroke:2px var(--outline);paint-order:stroke;text-shadow:3px 3px 0 var(--outline);transform:skewX(-6deg)}
.play-btn small{position:relative;font-size:11px;font-weight:700;opacity:.95;margin-top:1px}
.play-btn:active{transform:translateY(4px)}
.pb-play-wrap:has(.play-btn:active){filter:drop-shadow(0 1px 0 var(--outline))}
.play-btn.off .pb-face{background:linear-gradient(180deg,#9aa0c0,#6b7194)}
.pb-ring{--p:0%;position:relative;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;margin-bottom:3px;
  background:conic-gradient(#35d98a var(--p),var(--panel-2) 0);border:2.5px solid var(--outline);transition:--p .6s}
.pb-ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--outline)}
.pb-ring b{position:relative;font:28px/1 var(--display);color:#fff}
.pb-cubes{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:6px;background:var(--blue);color:#fff!important;transform:skewX(-8deg)}
.cube-ic{width:10px;height:10px;background:#fff;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.dp-list{display:flex;flex-direction:column;gap:8px;margin:10px 0 14px;max-height:55dvh;overflow-y:auto;padding:2px}
.dp-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2.5px solid var(--outline);border-radius:14px;background:var(--panel-2);padding:8px 10px}
.dp-row.on{background:var(--blue);color:#fff}
.dp-row.on small{color:#dfe6ff}
.dp-row[aria-disabled="true"] .dp-strip{opacity:.45}
.dp-strip{display:flex;flex:none}
.dp-strip .card{--cw:30px}
.dp-strip .card+.card{margin-left:-12px}
.dp-strip .ph{width:30px;aspect-ratio:3/4;border-radius:5px;border:2px dashed var(--zone-line)}
.dp-info{flex:1;min-width:0}
.dp-info b{display:block;font:20px/1.05 var(--display);letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp-info small{font-size:12px;font-weight:600;color:var(--muted)}
.dp-tag{flex:none;font-size:11px;font-weight:800;background:var(--yellow);color:#14142b;border-radius:6px;padding:2px 6px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.statgrid div{border:2px solid var(--outline);border-radius:12px;background:var(--panel-2);padding:8px;text-align:center}
.statgrid b{display:block;font:28px/1 var(--display)}
.statgrid small{font-size:12px;font-weight:700;color:var(--muted)}

/* ============ CONTENT PROBLEMS / BOOT ERRORS ============ */
#boot-error{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:#12132a;color:#f1f2ff;font-family:system-ui,sans-serif}
#boot-error .be-box{max-width:460px}
#boot-error pre{white-space:pre-wrap;background:#000;color:#ff8a96;padding:10px;border-radius:8px;font-size:13px}
#content-warn{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);z-index:950;width:min(460px,calc(100% - 20px));max-height:60dvh;overflow-y:auto;
  background:var(--panel);color:var(--ink);border:2.5px solid var(--bad);border-radius:14px;padding:10px 12px;box-shadow:0 4px 0 var(--outline)}
#content-warn b{display:block;font-size:14px}
#content-warn ul{margin:6px 0;padding-left:18px;font-size:12.5px;line-height:1.4}
#content-warn p{margin:0 0 6px;font-size:12px;color:var(--muted)}

/* ============ DECKS (Snap-style: slim deck on top, collection gets the room) ============ */
.dk-head{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 6px}
.hex-btn{width:46px;height:40px;flex:none;border:0;padding:2.5px;background:var(--outline);clip-path:polygon(22% 0,78% 0,100% 50%,78% 100%,22% 100%,0 50%)}
.hex-btn span{display:grid;place-items:center;height:100%;background:var(--blue);color:#fff;font-size:18px;font-weight:800;clip-path:inherit}
.hex-btn:active{transform:scale(.94)}
.dk-title{flex:1;min-width:0;height:40px;border:2.5px solid var(--outline);background:var(--panel);border-radius:6px;transform:skewX(-8deg);box-shadow:0 3px 0 var(--outline);padding:0 12px}
.dk-title b{display:block;transform:skewX(8deg);font:24px/1 var(--display);letter-spacing:.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk-title b::after{content:" ✎";font-size:14px;color:var(--muted)}
.dk-title:active{transform:skewX(-8deg) translateY(3px);box-shadow:none}
.dk-deck{margin:0 12px;padding:7px 7px 6px;border:2.5px solid var(--outline);border-radius:14px;background:color-mix(in srgb,var(--panel) 70%,transparent);box-shadow:var(--shadow)}
.deck-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.dslot{position:relative;aspect-ratio:3/4;border-radius:7px;border:2px dashed var(--zone-line);background:var(--zone)}
.dslot .card{--cw:100%;position:absolute;inset:0;cursor:pointer}
.dk-info{display:flex;align-items:center;gap:8px;margin-top:6px;min-height:26px}
.count{font-weight:800;font-size:13px;padding:2px 7px;border-radius:7px;background:var(--panel-2);white-space:nowrap}
.count.full{background:var(--good);color:#fff}
.curve{flex:1;display:flex;align-items:flex-end;gap:3px;height:24px;min-width:0}
.curve div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:8.5px;line-height:1;font-weight:700;color:var(--muted)}
.curve i{display:block;width:100%;margin-bottom:1px;background:var(--blue);border:1.5px solid var(--outline);border-radius:2px 2px 0 0;transition:height .3s}
.avg{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
.avg b{color:var(--ink);font-size:14px}
.dk-coll{padding-top:10px;padding-bottom:calc(140px + env(safe-area-inset-bottom))}
.coll-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 2px 8px}
.coll-head b{font:22px/1 var(--display);letter-spacing:.5px;font-weight:400}
.coll-head small{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.fab{position:absolute;z-index:20;bottom:calc(84px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:6px;height:44px;padding:0 14px;
  border:2.5px solid var(--outline);border-radius:22px;background:var(--blue);color:#fff;font-weight:800;font-size:14px;box-shadow:0 3px 0 var(--outline)}
.fab i{font-style:normal;font-size:18px}
.fab.left{left:12px}
.fab.right{right:12px}
.fab:active{transform:translateY(3px);box-shadow:none}
.fab em{display:none;width:10px;height:10px;border-radius:50%;background:var(--yellow);border:2px solid var(--outline)}
.fab em.on{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{flex:none;min-width:36px;height:36px;border-radius:50%;border:2px solid var(--outline);background:var(--panel-2);font:19px/1 var(--display)}
.chip.all{border-radius:18px;padding:0 12px;font:600 13px var(--ui)}
.chip.on{background:var(--blue);color:#fff}
.chip.rar{border-radius:18px;padding:0 12px;font:700 13px var(--ui)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-top:12px}
.toggle input{width:20px;height:20px;accent-color:var(--blue)}
.sheet-label{font-weight:800;margin:12px 0 6px}
.menu-list{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.menu-list .btn{text-align:left}
.rename-input{width:100%;font:26px var(--display);letter-spacing:.5px;border:2.5px solid var(--outline);border-radius:12px;background:var(--panel-2);color:var(--ink);padding:8px 12px;margin:6px 0 4px;user-select:text;-webkit-user-select:text}
.coll-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px}
@media (min-width:430px){.coll-grid{gap:12px 10px}}
.cc{position:relative;cursor:pointer}
.cc .card{--cw:100%}
.cc.indeck .card{filter:saturate(.35) brightness(.72)}
.cc .chk{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:3;width:30px;height:30px;border-radius:50%;background:var(--good);color:#fff;border:2.5px solid var(--outline);display:none;place-items:center;font-weight:800}
.cc.indeck .chk{display:grid}
.cc.locked .card{filter:grayscale(1) brightness(.55)}
.cc .lock{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:3;font-size:24px;display:none}
.cc.locked .lock{display:block}
.cc .info{position:absolute;right:-4px;bottom:-4px;z-index:4;width:24px;height:24px;border-radius:50%;border:2px solid var(--outline);background:var(--panel);font-size:12px;font-weight:800;padding:0}
.cc .own{position:absolute;left:-3px;bottom:-4px;z-index:4;font-size:10px;font-weight:800;background:var(--panel);border:2px solid var(--outline);border-radius:8px;padding:0 4px}
.empty{padding:24px;text-align:center;color:var(--muted)}

/* ============ SHOP ============ */
.sec{display:flex;align-items:center;justify-content:space-between;font:26px/1 var(--display);letter-spacing:.5px;margin:14px 0 8px;font-weight:400}
.sec small{font:600 12px var(--ui);color:var(--muted)}
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shop-item{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--panel);border:2.5px solid var(--outline);border-radius:14px;padding:10px 6px;box-shadow:var(--shadow)}
.shop-item .desc{font-size:11px;color:var(--muted);text-align:center;line-height:1.25;min-height:28px}
.pack{--pw:84px;position:relative;width:var(--pw);aspect-ratio:5/7;border-radius:8px;border:2.5px solid var(--outline);overflow:hidden;color:#fff;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 80%,#fff),color-mix(in srgb,var(--c) 42%,#000));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pack::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.25) 1px,transparent 1.3px) 0 0/6px 6px}
.pack::after{content:"";position:absolute;top:-20%;bottom:-20%;width:40%;left:-60%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:sheen 3.2s ease-in-out infinite}
@keyframes sheen{60%,100%{left:130%}}
.pack .crimp{position:absolute;left:0;right:0;height:9%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 3px,rgba(255,255,255,.18) 3px 6px)}
.pack .crimp.t{top:0;border-bottom:2px solid var(--outline)}
.pack .crimp.b{bottom:0;border-top:2px solid var(--outline)}
.pack .p-logo{position:relative;font:calc(var(--pw)*.2)/1 var(--display);color:var(--yellow);-webkit-text-stroke:1.5px var(--outline);paint-order:stroke;transform:rotate(-6deg)}
.pack .p-name{position:relative;font:calc(var(--pw)*.15)/1 var(--display);letter-spacing:.5px;-webkit-text-stroke:1px var(--outline);paint-order:stroke;text-align:center;padding:0 4px}
.pack .p-count{position:relative;font-size:calc(var(--pw)*.11);font-weight:800;background:var(--outline);border-radius:6px;padding:1px 5px}
.price{font-weight:800;font-size:14px}
.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.feat .fi{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.feat .card{--cw:100%;cursor:pointer}
.bundles{display:flex;flex-direction:column;gap:10px}
.bundle{display:flex;gap:10px;align-items:center;background:var(--panel);border:2.5px solid var(--outline);border-radius:14px;padding:10px;box-shadow:var(--shadow)}
.bundle .bicon{width:54px;height:54px;flex:none;border-radius:12px;border:2.5px solid var(--outline);display:grid;place-items:center;font-size:30px;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 85%,#fff),color-mix(in srgb,var(--c) 45%,#000))}
.bundle .binfo{flex:1;min-width:0}
.bundle b{font:22px/1 var(--display);letter-spacing:.4px;display:block}
.bundle .strip{font-size:17px;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.bundle small{font-size:11px;color:var(--muted)}

/* ============ MATCH ============ */
#scr-match{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.mtop{display:flex;align-items:center;gap:8px;padding:6px 8px 4px}
.opp,.energy{cursor:pointer}
.opp-en{display:inline-block;padding:0 5px;border-radius:6px;background:var(--blue);color:#fff;font-weight:800}
.opp-en.bonus{background:var(--good)}
.en-bonus{position:absolute;right:-7px;top:-7px;min-width:22px;height:20px;padding:0 4px;border-radius:10px;background:var(--good);color:#fff;border:2px solid var(--outline);font:800 11px/16px var(--ui);font-style:normal;text-align:center;display:none}
.en-bonus.on{display:block}
.en-list{list-style:none;padding:0;margin:10px 0 6px;border:2px solid var(--outline);border-radius:12px;overflow:hidden}
.en-list li{display:flex;justify-content:space-between;gap:10px;padding:7px 12px;font-weight:600;background:var(--panel-2)}
.en-list li+li{border-top:1px dashed var(--line)}
.en-list li.total{background:var(--blue);color:#fff}
.opp{flex:1;display:flex;align-items:center;gap:7px;min-width:0}
.avatar{width:36px;height:36px;flex:none;border-radius:10px;border:2.5px solid var(--outline);background:var(--panel);display:grid;place-items:center;font-size:20px;position:relative}
.opp b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp small{display:block;font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.first-flag{display:none;font-size:10px;font-weight:800;color:#14142b;background:var(--yellow);border-radius:5px;padding:0 4px;margin-left:3px}
.first-flag.on{display:inline-block}
.stakes{display:flex;flex-direction:column;align-items:center;gap:1px}
.cube{width:40px;height:40px;display:grid;place-items:center;font:24px/1 var(--display);color:#fff;background:var(--outline);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);position:relative}
.cube::before{content:"";position:absolute;inset:3px;background:linear-gradient(160deg,#7ea6ff,var(--blue-dk));clip-path:inherit}
.cube span{position:relative;-webkit-text-stroke:1px var(--outline);paint-order:stroke}
.cube.boom{animation:cubeBoom .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes cubeBoom{30%{transform:scale(1.6) rotate(20deg)}}
.stakes small{font-size:10px;font-weight:800;color:var(--red);min-height:12px}
.turnbox{flex:1;text-align:right;font-weight:700;font-size:12px;color:var(--muted)}
.turnbox b{display:block;font:24px/1 var(--display);color:var(--ink);letter-spacing:.5px}
.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:2px 6px}
.lcol{display:flex;flex-direction:column;min-height:0;gap:5px;border-radius:12px;transition:background .3s, box-shadow .3s}
.zone{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;padding:3px;border-radius:10px;
  background:var(--zone);border:2px dashed transparent;transition:background .15s, border-color .15s}
.zone.ok{background:rgba(17,153,74,.18);border-color:var(--good)}
.zone.bad{background:rgba(216,40,61,.12);border-color:var(--bad)}
.zone .why{grid-area:1/1/3/3;align-self:center;justify-self:center;z-index:3;font-size:10px;font-weight:700;background:var(--bad);color:#fff;padding:3px 6px;border-radius:6px;text-align:center;pointer-events:none}
.slot{container-type:size;display:grid;place-items:center;min-height:0;min-width:0}
.slot>.card{--cw:min(100cqw,75cqh)}
.loc{position:relative;height:clamp(76px,13dvh,106px);perspective:700px;flex:none;cursor:pointer}
.loc-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
.loc.hidden .loc-inner{transform:rotateX(180deg)}
.loc-face{position:absolute;inset:0;border-radius:12px;border:2.5px solid var(--outline);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.loc-front{background:linear-gradient(170deg,color-mix(in srgb,var(--c) 85%,#fff),color-mix(in srgb,var(--c) 45%,#000));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 4px;text-align:center}
.loc-front::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.2) 1px,transparent 1.3px) 0 0/6px 6px}
.loc-icon{position:absolute;font-size:44px;opacity:.28;right:-4px;bottom:-6px}
.loc-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.loc-front.has-art::before{z-index:1;background:linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.55))}
.loc-front.has-art .loc-name,.loc-front.has-art .loc-text{z-index:2}
.loc-front.has-art .loc-icon{display:none}
.loc-tag{position:absolute;left:4px;top:4px;z-index:3;display:none;font-size:9px;font-weight:800;line-height:1.3;background:var(--yellow);color:#14142b;border:1.5px solid var(--outline);border-radius:6px;padding:0 4px}
.loc.closing .loc-tag{display:block;animation:tagPulse 1.2s ease-in-out infinite}
@keyframes tagPulse{50%{transform:scale(1.08)}}
.loc-name{position:relative;font:clamp(14px,3.9vw,18px)/1 var(--display);letter-spacing:.4px;-webkit-text-stroke:.8px var(--outline);paint-order:stroke}
.loc-text{position:relative;margin-top:3px;font-size:clamp(8.5px,2.3vw,10.5px);font-weight:600;line-height:1.2;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.loc-back{transform:rotateX(180deg);background:repeating-linear-gradient(135deg,var(--panel) 0 8px,var(--panel-2) 8px 16px);display:grid;place-items:center;align-content:center;color:var(--muted)}
.lb-q{font:34px/1 var(--display);color:var(--ink)}
.loc-back small{font-size:10px;font-weight:700}
.loc-pow{position:absolute;left:50%;z-index:3;width:30px;height:30px;margin-left:-15px;display:grid;place-items:center;border-radius:50%;
  border:2.5px solid var(--outline);background:var(--panel);font:18px/1 var(--display);transition:background .2s, transform .2s;opacity:0}
.loc:not(.hidden) .loc-pow{opacity:1}
.loc-pow.p1{top:-10px}
.loc-pow.p0{bottom:-10px}
.loc-pow.win{background:var(--yellow);color:#14142b;transform:scale(1.12)}
.loc-pow.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.5)}}
.loc-lock{position:absolute;inset:0;z-index:2;display:none;place-items:center;align-content:center;gap:1px;background:rgba(10,10,30,.62);border-radius:12px;color:#fff}
.loc-lock span{font-size:22px;line-height:1}
.loc-lock small{font:15px/1 var(--display);letter-spacing:.6px}
.loc.locked .loc-lock{display:grid}
.lcol.won{background:rgba(255,210,63,.3);box-shadow:0 0 0 2.5px var(--yellow)}
.lcol.lost{background:rgba(216,40,61,.14)}
.lcol.tied{opacity:.7}
.handwrap{position:relative;flex:none;padding:6px 8px 4px}
.hand{--cw:min(19vw,84px);--cw:min(19vw,84px,12.5dvh);height:calc(var(--cw)*4/3 + 8px);display:flex;justify-content:center;align-items:flex-end}
.hand .card{cursor:grab;transition:margin .25s ease}
.hand .card .card-inner{transition:transform .2s ease}
@media (hover:hover){.hand .card:hover .card-inner{transform:translateY(-6px)}}
.hand.drop-home{background:rgba(47,107,255,.1);border-radius:12px}
.deckpile{position:absolute;right:8px;top:-12px;z-index:3;font-size:11px;font-weight:800;background:var(--panel);border:2px solid var(--outline);border-radius:8px;padding:1px 6px}
.mbot{display:flex;align-items:center;gap:8px;padding:4px 10px 8px}
.energy{position:relative;width:54px;height:54px;flex:none;border-radius:50%;border:3px solid var(--outline);display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#9cc2ff,var(--blue) 55%,var(--blue-dk));color:#fff;font:30px/1 var(--display);box-shadow:0 3px 0 var(--outline)}
.energy span{-webkit-text-stroke:1.2px var(--outline);paint-order:stroke}
.energy.zero{filter:grayscale(.8)}
.energy.pulse{animation:bump .4s ease}
.mbot .grow{flex:1}
.endturn{border:3px solid var(--outline);border-radius:14px;background:var(--panel);padding:6px 14px;box-shadow:0 4px 0 var(--outline);line-height:1;min-width:112px}
.endturn b{display:block;font:24px/1 var(--display);letter-spacing:1px}
.endturn small{font-size:11px;font-weight:700;color:var(--muted)}
.endturn.ready{background:var(--yellow);color:#14142b;animation:readyPulse 1.2s ease-in-out infinite}
.endturn.ready small{color:#4a3c00}
@keyframes readyPulse{50%{box-shadow:0 4px 0 var(--outline),0 0 0 6px rgba(255,210,63,.45)}}
.endturn:active{transform:translateY(4px);box-shadow:none}
.endturn:disabled{opacity:.55}
.blitz{border:3px solid var(--outline);border-radius:14px;background:var(--red);color:#fff;padding:6px 10px;box-shadow:0 4px 0 var(--outline);line-height:1}
.blitz b{display:block;font:20px/1 var(--display);letter-spacing:1px}
.blitz small{font-size:10px;font-weight:700}
.blitz:active{transform:translateY(4px);box-shadow:none}
.blitz:disabled{opacity:.4;filter:grayscale(.6)}
.retreat{width:40px;height:40px;flex:none;border-radius:12px;border:2.5px solid var(--outline);background:var(--panel);font-size:18px;box-shadow:0 3px 0 var(--outline)}
.retreat:disabled{opacity:.4}

.float{position:fixed;z-index:950;pointer-events:none;font:26px/1 var(--display);letter-spacing:.5px;color:#fff;-webkit-text-stroke:1.5px var(--outline);paint-order:stroke;
  transform:translate(-50%,-50%);animation:floatUp 1s ease-out forwards;white-space:nowrap}
.float.good{color:#6ff0a4}.float.bad{color:#ff7d8b}.float.info{color:var(--yellow);font-size:18px}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
.banner{position:absolute;left:0;right:0;top:42%;z-index:60;pointer-events:none;display:flex;justify-content:center}
.banner .strip{background:var(--outline);color:#fff;padding:10px 0 8px;width:100%;text-align:center;transform:skewY(-4deg);animation:bannerIn 1.2s cubic-bezier(.2,.9,.3,1) forwards;border-top:4px solid var(--yellow);border-bottom:4px solid var(--yellow)}
.banner b{display:block;font:46px/1 var(--display);letter-spacing:2px;color:var(--yellow)}
.banner small{display:block;font-weight:700;font-size:13px;margin-top:2px}
.banner.red .strip{border-color:var(--red)}
.banner.red b{color:#ff8a94}
@keyframes bannerIn{0%{transform:skewY(-4deg) scaleY(0);opacity:0}12%{transform:skewY(-4deg) scaleY(1);opacity:1}82%{opacity:1;transform:skewY(-4deg) scaleY(1)}100%{opacity:0;transform:skewY(-4deg) scaleY(.2)}}
.particle{position:fixed;z-index:2100;width:9px;height:9px;border-radius:2px;pointer-events:none;border:1.5px solid var(--outline);animation:part .9s cubic-bezier(.15,.8,.3,1) forwards}
@keyframes part{to{transform:translate(var(--dx),var(--dy)) rotate(620deg) scale(.3);opacity:0}}

/* ============ OVERLAYS ============ */
.overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .25s, visibility 0s .25s}
.overlay.open{opacity:1;visibility:visible;transition-delay:0s}
#modal{background:rgba(8,8,20,.6);padding:16px}
.modal-box{width:100%;max-width:400px;max-height:90dvh;overflow-y:auto;background:var(--panel);border:3px solid var(--outline);border-radius:18px;padding:16px;box-shadow:0 6px 0 var(--outline);transform:scale(.9);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
#modal.open .modal-box{transform:none}
.modal-box h2{font:30px/1 var(--display);letter-spacing:.5px;margin:0 0 6px;font-weight:400}
.modal-box p{margin:6px 0;line-height:1.45;font-size:14px}
.modal-btns{display:flex;gap:8px;margin-top:14px}
.modal-btns .btn{flex:1}
.detail{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.detail-card{perspective:600px;flex:none}
.detail-card .card{--cw:132px;transition:transform .15s ease-out}
.detail-info{flex:1;min-width:0}
.detail-info .rar{font-weight:800;font-size:12px}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.st{font-weight:800;font-size:12px;padding:3px 8px;border-radius:8px;border:2px solid var(--outline)}
.st.cost{background:var(--blue);color:#fff}
.st.pow{background:#f07a1a;color:#fff}
.playat{display:flex;gap:6px;margin-top:4px}
.playat .btn{flex:1;font-size:12px;padding:8px 4px;white-space:normal;line-height:1.1}
.rules{padding-left:18px;margin:6px 0;font-size:14px;line-height:1.45}
.rules li{margin-bottom:5px}
.seg{display:flex;border:2px solid var(--outline);border-radius:10px;overflow:hidden;margin:6px 0 12px}
.seg button{flex:1;border:0;background:var(--panel);padding:8px;font-weight:700}
.seg button.on{background:var(--blue);color:#fff}
#toasts{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:3000;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:var(--outline);color:#fff;font-weight:700;font-size:14px;padding:8px 14px;border-radius:12px;border:2px solid var(--yellow);animation:toastIn .3s cubic-bezier(.3,1.5,.5,1);transition:opacity .3s, transform .3s;text-align:center}
.toast.out{opacity:0;transform:translateY(-10px)}
@keyframes toastIn{from{transform:translateY(-20px) scale(.9);opacity:0}}

#vs{background:var(--outline);z-index:400;overflow:hidden}
#vs .half{position:absolute;left:0;right:0;height:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff}
#vs .half.ai{top:0;background:var(--red);clip-path:polygon(0 0,100% 0,100% 88%,0 100%);transform:translateX(-100%)}
#vs .half.you{bottom:0;background:var(--blue);clip-path:polygon(0 12%,100% 0,100% 100%,0 100%);transform:translateX(100%)}
#vs.open .half{animation:vsSlide .45s cubic-bezier(.2,.9,.3,1) forwards}
#vs .vs-av{font-size:54px}
#vs .half b{font:34px/1 var(--display);letter-spacing:1px}
#vs .half small{font-weight:700;opacity:.9}
#vs .vs-mid{position:relative;z-index:2;font:90px/1 var(--display);color:var(--yellow);-webkit-text-stroke:3px var(--outline);paint-order:stroke;transform:scale(0) rotate(-20deg)}
#vs.open .vs-mid{animation:vsMid .5s .35s cubic-bezier(.3,1.7,.5,1) forwards}
@keyframes vsSlide{to{transform:none}}
@keyframes vsMid{to{transform:scale(1) rotate(-8deg)}}

#result{background:rgba(8,8,20,.72);z-index:300;padding:16px}
.res-box{width:100%;max-width:360px;text-align:center;background:var(--panel);border:3px solid var(--outline);border-radius:20px;padding:22px 16px 16px;box-shadow:0 6px 0 var(--outline)}
.res-title{font:64px/1 var(--display);letter-spacing:2px;-webkit-text-stroke:2px var(--outline);paint-order:stroke;text-shadow:4px 4px 0 var(--outline);transform:rotate(-4deg) scale(0)}
#result.open .res-title{animation:stamp .5s .1s cubic-bezier(.3,1.7,.5,1) forwards}
@keyframes stamp{to{transform:rotate(-4deg) scale(1)}}
.res-title.win{color:var(--yellow)}.res-title.lose{color:var(--red)}.res-title.draw{color:#aab3d6}
.res-sub{color:var(--muted);font-weight:600;margin:8px 0 14px;font-size:14px}
.res-rows{display:flex;justify-content:center;gap:10px;margin-bottom:16px}
.res-row{flex:1;border:2.5px solid var(--outline);border-radius:14px;padding:8px;background:var(--panel-2)}
.res-row b{display:block;font:30px/1 var(--display)}
.res-row small{font-size:11px;font-weight:700;color:var(--muted)}
.res-btns{display:flex;gap:8px}
.res-btns .btn{flex:1}

#packov{background:radial-gradient(circle at 50% 45%,#2d2a73,#0a0a1c 75%);z-index:500;flex-direction:column}
.po-rays{position:absolute;inset:-50%;background:repeating-conic-gradient(rgba(255,210,63,.12) 0 10deg,transparent 10deg 20deg);animation:spin 30s linear infinite}
.po-stage{position:relative;width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px}
.po-hint{color:#fff;font:26px/1 var(--display);letter-spacing:1px;text-align:center;min-height:26px}
.po-pack .pack{--pw:min(52vw,210px);cursor:pointer;animation:packIdle 2s ease-in-out infinite}
@keyframes packIdle{50%{transform:translateY(-10px) rotate(2deg)}}
.pack.shake{animation:shake .7s linear!important}
@keyframes shake{10%,50%,90%{transform:translateX(-6px) rotate(-4deg)}30%,70%{transform:translateX(6px) rotate(4deg)}100%{transform:scale(1.1)}}
.pack.gone{animation:packGone .4s ease-in forwards!important}
@keyframes packGone{to{transform:scale(1.8);opacity:0;filter:brightness(3)}}
.po-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.po-flash.go{animation:flash .5s ease-out}
@keyframes flash{15%{opacity:.9}100%{opacity:0}}
.po-cards{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:100%}
.po-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.po-card .card{--cw:min(27vw,118px)}
.po-card::before{content:"";position:absolute;left:50%;top:40%;width:80%;height:70%;transform:translate(-50%,-50%);border-radius:50%;filter:blur(18px);opacity:0}
.po-card[data-r="rare"]::before{background:#4aa8ff;opacity:.8;animation:glowP 1.2s ease-in-out infinite}
.po-card[data-r="epic"]::before{background:#b86bff;opacity:.9;animation:glowP .9s ease-in-out infinite}
.po-card[data-r="legendary"]::before{background:#ffc53d;opacity:1;animation:glowP .6s ease-in-out infinite;width:120%;height:100%}
.po-card.shown::before{animation:none;opacity:.5}
@keyframes glowP{50%{opacity:.35;transform:translate(-50%,-50%) scale(1.15)}}
.po-card:not(.shown) .card{animation:wobble 2.4s ease-in-out infinite}
@keyframes wobble{50%{transform:rotate(2deg) translateY(-3px)}}
.po-lab{min-height:20px;font-weight:800;font-size:13px;color:#fff;opacity:0;transform:translateY(6px);transition:.3s}
.po-card.shown .po-lab{opacity:1;transform:none}
.po-lab .new{background:var(--red);border:2px solid #fff;border-radius:6px;padding:0 6px;font:16px/1.2 var(--display);letter-spacing:1px}
.po-lab .rn{display:block;font-size:10px;text-align:center}
.po-actions{display:flex;gap:10px}
.shakescreen{animation:screenShake .45s linear}
@keyframes screenShake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
  .showcase .burst-bg{animation:none}
}
@media (min-width:481px){ #app{border-left:2.5px solid var(--outline);border-right:2.5px solid var(--outline)} }
</style>
